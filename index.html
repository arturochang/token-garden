(function pagePet() {
  const el = document.getElementById("pagepet");
  const fig = document.getElementById("petfig");
  const bub = document.getElementById("petbubble");
  if (!el || !fig || typeof petFig === "undefined") return;
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rnd = (a, b) => a + Math.random() * (b - a);
  let x = Math.min(window.innerWidth - 160, rnd(60, 300));
  let dir = Math.random() < 0.5 ? -1 : 1, mode = "sit", frame = 0, target = null, speed = 0, after = null;
  let resume = null, hopsLeft = 0;
  let bubbleTimer = 0, pending = false, watchX = null;
  const rawTimeout = window.setTimeout.bind(window);
  const rawClear = window.clearTimeout.bind(window);
  // Tracked timer: watchdog knows a trick is already queued.
  function arm(fn, ms) {
    pending = true;
    return rawTimeout(() => { pending = false; fn(); }, ms);
  }
  function say(txt, ms) {
    if (!bub) return;
    bub.textContent = txt;
    bub.hidden = false;
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => { bub.hidden = true; }, ms || 1500);
  }
  // Split render: figure art only rebuilds on pose/frame change;
  // position updates every animation frame for smooth gliding.
  let figKey = "", petStyle = "";
  function paintFig() {
    const st = (typeof state !== "undefined" && state.crewStyle) || "gnomes";
    const key = st + "|" + (mode === "hop" ? "run" : mode) + ":" + frame;
    if (key === figKey) return;
    figKey = key; petStyle = st;
    fig.innerHTML = petFig(mode === "hop" ? "run" : mode, frame);
    const label = activePetProfile().labels[mode === "hop" ? "run" : mode] || mode;
    el.title = "Page pet: " + label + "; click to interact";
  }
  function place() {
    if (!isFinite(x)) x = clampX(300); // never strand the pet off-world
    fig.style.transform = dir < 0 ? "scaleX(-1)" : "none";
    el.style.transform = `translateX(${x.toFixed(1)}px)`;
    el.dataset.mode = mode === "hop" ? "walk" : mode;
  }
  function draw() { paintFig(); place(); }
  function clampX(v) { return Math.max(0, Math.min(window.innerWidth - 144, v)); }
  const pickGreet = () => {
    const lines = activePetProfile().greetings;
    return lines[Math.floor(Math.random() * lines.length)];
  };
  // Weighted trick bag; weights jitter every draw so streaks happen.
  function drawTrick() {
    const weights = activePetProfile().weights;
    const bag = Object.entries(weights).map(([name, weight]) => [name, Math.max(0, weight) * rnd(.85, 1.15)]);
    let total = 0;
    for (const [, w] of bag) total += w;
    let r = Math.random() * total;
    for (const [name, w] of bag) { r -= w; if (r <= 0) return name; }
    return "walk";
  }
  function wander() {
    const trick = drawTrick();
    const profile = activePetProfile();
    resume = null;
    if (trick === "walk") {
      mode = "walk"; speed = rnd(...profile.speed.walk);
      // Nearby amble or cross-page trek, either direction.
      target = Math.random() < 0.45 ? clampX(x + rnd(-1, 1) * rnd(60, 420)) : clampX(rnd(0, window.innerWidth - 144));
    } else if (trick === "run") {
      mode = "run"; speed = rnd(...profile.speed.run);
      // Random far point, edge, or sudden U-turn mid-dash.
      target = Math.random() < 0.5 ? clampX(rnd(0, window.innerWidth - 144)) : (dir > 0 ? clampX(window.innerWidth - 144) : 0);
      if (Math.abs(target - x) < 60) { dir = -dir; target = clampX(x + dir * rnd(200, 500)); }
    } else if (trick === "sit") {
      mode = "sit"; target = null;
      if (Math.random() < 0.3) dir = -dir; // look around for no reason
      after = arm(wander, rnd(...profile.timing.sit));
    } else if (trick === "wave" || trick === "special") {
      mode = trick; target = null; frame = 0;
      say(pickGreet(), rnd(1100, 1800));
      after = arm(wander, rnd(...profile.timing.wave));
    } else if (trick === "hop") {
      mode = "hop"; target = null; frame = 0; hopsLeft = 3 + Math.floor(rnd(0, 4));
      if (Math.random() < 0.5) dir = -dir;
    } else if (trick === "spin") {
      mode = "wave"; target = null; frame = 0;
      dir = -dir; // whip around + wave reads as a twirl
      say(pickGreet(), 1300);
      after = arm(() => { if (Math.random() < 0.5) { dir = -dir; } wander(); }, rnd(1200, 2000));
    } else {
      mode = "nap"; target = null;
      after = arm(() => { mode = activePetProfile().interaction; frame = 0; say(pickGreet()); draw(); after = arm(wander, rnd(...activePetProfile().timing.wave)); }, rnd(...profile.timing.nap));
    }
    if (target != null) dir = target >= x ? 1 : -1;
    draw();
  }
  // rAF movement: velocity eases toward cruise speed and bleeds off near
  // the target; stride frames flip per distance travelled so feet match
  // ground speed. Hops ride a sine lift; waves toggle on a timer.
  let last = performance.now(), vel = 0, dist = 0, waveAcc = 0, hopT = 0;
  function arrive() {
    x = target; target = null; vel = 0;
    if (mode === "run") { mode = "sit"; draw(); after = arm(wander, rnd(1000, 3500)); return; }
    const r = Math.random();
    if (r < 0.3) { mode = activePetProfile().interaction; frame = 0; waveAcc = 0; say(pickGreet(), rnd(1100, 1700)); after = arm(wander, rnd(...activePetProfile().timing.wave)); }
    else if (r < 0.42) { mode = "hop"; frame = 0; hopT = 0; hopsLeft = 2 + Math.floor(rnd(0, 3)); }
    else { mode = "sit"; after = arm(wander, rnd(1500, 5000)); }
    draw();
  }
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    // Crew style switched mid-roam: swap costume immediately.
    const st = (typeof state !== "undefined" && state.crewStyle) || "gnomes";
    if (st !== petStyle) { figKey = ""; paintFig(); place(); }
    if (!reduced) {
      if (mode === "walk" || mode === "run") {
        if (target != null) {
          // Random mid-stroll interruption: stop and wave, then carry on.
          if (mode === "walk" && resume == null && Math.random() < dt * 0.07 && Math.abs(target - x) > 80) {
            resume = { target, speed };
            target = null; vel = 0; mode = activePetProfile().interaction; frame = 0; waveAcc = 0;
            say(pickGreet(), 1300);
            draw();
            after = arm(() => {
              const r = resume; resume = null;
              if (!r) { wander(); return; }
              mode = "walk"; speed = r.speed; target = r.target;
              dir = target >= x ? 1 : -1;
              draw();
            }, rnd(1300, 1900));
          } else {
            // Random dash U-turn.
            if (mode === "run" && Math.random() < dt * 0.045 && Math.abs(target - x) > 120) {
              target = clampX(x - Math.sign(target - x) * rnd(150, 450));
              dir = target >= x ? 1 : -1;
            }
            // Ease: full cruise far away, bleed off within ~60px.
            const want = speed * Math.min(1, Math.abs(target - x) / 60 + 0.12);
            vel += (want - vel) * Math.min(1, dt * 7);
            const wobble = 1 + Math.sin(now / 130) * 0.07; // unsteady feet
            const step = vel * wobble * dt;
            const d = Math.sign(target - x) * Math.min(Math.abs(step), Math.abs(target - x));
            x += d; dist += Math.abs(d);
            const strideEvery = mode === "run" ? 20 : 13;
            if (dist >= strideEvery) { dist = 0; frame++; paintFig(); }
            if (Math.abs(target - x) < 1) arrive();
            else place();
          }
        } else place();
      } else if (mode === "hop") {
        hopT += dt;
        const hopDuration = activePetProfile().timing.hopDuration;
        if (hopT >= hopDuration) {
          hopT = 0; frame++;
          if (--hopsLeft <= 0) { mode = "sit"; draw(); after = arm(wander, rnd(1200, 4000)); }
          else paintFig();
        }
        fig.style.marginBottom = (Math.sin(Math.PI * hopT / hopDuration) * 14).toFixed(1) + "px";
      } else {
        if (mode !== "wave" && mode !== "special" && fig.style.marginBottom && fig.style.marginBottom !== "0px") fig.style.marginBottom = "0";
        if (mode === "wave" || mode === "special") {
          waveAcc += dt;
          if (waveAcc >= 0.22) { waveAcc = 0; frame++; paintFig(); }
          // Double-take: sometimes flip direction mid-wave.
          if (mode === "wave" && frame === 4 && target == null && resume == null && Math.random() < 0.25) { dir = -dir; place(); }
        }
      }
    } else if (mode !== "sit") { mode = "sit"; draw(); }
    requestAnimationFrame(tick);
  }
  el.addEventListener("click", () => {
    if (reduced) { say(pickGreet()); return; }
    rawClear(after); pending = false;
    resume = null; target = null; mode = activePetProfile().interaction; frame = 0;
    say(pickGreet(), 1500);
    draw();
    after = arm(wander, rnd(...activePetProfile().timing.wave));
  });
  window.addEventListener("resize", () => { x = clampX(x); draw(); });
  draw();
  // rAF with interval fallback + watchdog: if the frame loop or a timer
  // ever dies, the pet self-heals instead of stranding in the corner.
  if (window.requestAnimationFrame) requestAnimationFrame(tick);
  else setInterval(() => tick(performance.now()), 50);
  setInterval(() => {
    if (reduced) return;
    if (!pending && target == null && (mode === "sit" || mode === "wave" || mode === "special")) wander();
    else if (mode === "walk" || mode === "run") {
      // No progress for a full watchdog cycle: force recovery.
      if (watchX != null && Math.abs(x - watchX) < 0.5) {
        if (target != null) arrive(); else { mode = "sit"; wander(); }
      }
      watchX = x;
    } else watchX = null;
  }, 4000);
  if (!reduced) { after = arm(wander, rnd(1500, 4000)); }
})();

// Arm-wrestle pair when a tile's current vs previous differ by 5x or more.
function wrestle(cur, prev) {
  if (!(prev > 0) || !(cur >= 0)) return "";
  const r = cur / prev;
  if (r < 5 && r > 1 / 5) return "";
  const champ = r >= 5 ? t("vs_current") : t("vs_previous");
  const odds = r >= 1 ? mult(r) : mult(1 / r);
  const title = state.lang === "zh-Hant"
    ? `對決：目前 ${fmt(cur)} vs 上期 ${fmt(prev)} — ${champ}獲勝 ×${odds}`
    : `Showdown: current ${fmt(cur)} vs previous ${fmt(prev)} — ${champ} wins ×${odds}`;
  return `<span class="wrestle" title="${title}">${crewHead("#D97757")}<span class="vs">vs</span>${crewHead("#10A37F")}</span>`;
}

function renderCrew(recs, from, to) {
  const crew = document.getElementById("crew");
  const btn = document.getElementById("gnomes");
  if (!crew) return;
  if (btn) refreshGnomeBtn();
  refreshCrewBtn();
  crew.hidden = !state.gnomes;
  if (!state.gnomes) return;
  if (!crew.children.length || crew.dataset.style !== state.crewStyle) {
    crew.dataset.style = state.crewStyle;
    crew.innerHTML = TOOLS.map((t) => `<div class="gnome" data-tool="${t}" role="button" tabindex="0" title="">${crewFig(t)}<div class="cinfo"><div class="tlabel">${t}</div><div class="rlabel"></div><div class="haul"><span class="sack">◆</span><span class="cart"><i></i></span></div></div><span class="zzz">z</span><span class="dust d1"></span><span class="dust d2"></span></div>`).join("");
    crew.querySelectorAll(".gnome").forEach((el) => {
      const toggle = () => toggleTool(el.dataset.tool);
      el.addEventListener("click", toggle);
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });
    });
  }
  // Aggregates ignore the tool filter so ghosted-off gnomes still report true rates.
  const agg = {};
  TOOLS.forEach((t) => (agg[t] = { active: 0, cost: 0, input: 0, cacheRead: 0, cacheWrite: 0 }));
  for (const r of ALL) {
    if (r.ts < from || r.ts > to) continue;
    if (state.project && r.project !== state.project) continue;
    if (!state.includeSub && r.sidechain) continue;
    const a = agg[r.tool];
    if (!a) continue;
    a.active += r.active ?? (r.input + r.output);
    if (r.cost != null) a.cost += r.cost;
    a.input += r.input; a.cacheRead += r.cacheRead; a.cacheWrite += r.cacheWrite;
  }
  const spanSec = Math.max(((to || Date.now()) - (from || Date.now())) / 1000, 60);
  const maxCost = Math.max(...TOOLS.map((t) => agg[t].cost), 0);
  for (const el of crew.children) {
    const t = el.dataset.tool;
    const a = agg[t];
    const rate = a.active / spanSec; // active tokens/sec
    const spd = Math.min(1.5, Math.max(0.32, 1.5 - Math.log10(1 + rate) * 0.3));
    el.style.setProperty("--spd", spd.toFixed(2) + "s");
    const off = !state.tools.has(t);
    const idle = a.active <= 0;
    el.classList.toggle("off", off);
    el.classList.toggle("idle", idle && !off);
    el.classList.toggle("frenzy", rate > 1500 && !off && !idle);
    el.querySelector(".rlabel").textContent = off ? "off" : idle ? "idle" : fmt(rate) + "/s";
    el.title = off
      ? `${t}: filtered out — click to include`
      : idle
        ? `${t}: idle in this window — click to filter`
        : `${t}: ${fmt(a.active)} active (${fmt(rate)}/s) — click to filter`;
    const sack = el.querySelector(".sack");
    if (maxCost > 0 && a.cost > 0) {
      sack.style.display = "";
      sack.style.fontSize = (8 + 10 * (a.cost / maxCost)).toFixed(1) + "px";
      sack.title = `${t} cost ${money(a.cost)}`;
    } else {
      sack.style.display = "none";
    }
    const denom = a.input + a.cacheRead + a.cacheWrite;
    const hit = denom ? a.cacheRead / denom : 0;
    el.querySelector(".cart i").style.width = (hit * 100).toFixed(0) + "%";
    el.querySelector(".cart").title = `${t} cache hit ${(hit * 100).toFixed(1)}%`;
  }
}

function renderHeat(recs) {
  const grid = Array.from({ length: 7 }, () => Array(24).fill(0));
  const perHour = Array(24).fill(0);
  const perDay = Array(7).fill(0);
  const perDate = new Map();
  const sessions = new Set();
  let total = 0;
  for (const r of recs) {
    const v = metricVal(r);
    const d = new Date(r.ts);
    const di = (d.getDay() + 6) % 7;
    const h = d.getHours();
    grid[di][h] += v;
    perHour[h] += v;
    perDay[di] += v;
    total += v;
    sessions.add(r.tool + ":" + r.session);
    const key = d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
    perDate.set(key, (perDate.get(key) || 0) + v);
  }
  const max = Math.max(1, ...grid.flat());
  const days = state.lang === "zh-Hant"
    ? ["週一", "週二", "週三", "週四", "週五", "週六", "週日"]
    : ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  let html = "<div></div>";
  for (let h = 0; h < 24; h++) html += `<div class="lbl" style="text-align:center">${h}</div>`;
  let struck = false; // richest vein gets the miner's gold outline
  grid.forEach((row, di) => {
    html += `<div class="lbl">${days[di]}</div>`;
    row.forEach((v, h) => {
      const a = v / max;
      const bg = v ? `rgba(110,86,207,${(0.1 + 0.9 * a).toFixed(2)})` : "transparent";
      const strike = !struck && v > 0 && v === max;
      if (strike) struck = true;
      const stilly = !v && h < 6 ? " stilly" : "";
      html += `<div class="cell${strike ? " strike" : ""}${stilly}" title="${strike ? t("richest") : stilly ? t("deadnight") : ""}${metricFmt(v)}${state.metric === "cost" ? "" : " " + t("m_" + state.metric)}" style="background:${bg};border:1px solid var(--border)"></div>`;
    });
  });
  document.getElementById("heatmap").innerHTML = html;
  // Rhythm stats from the same window.
  const peakH = perHour.indexOf(Math.max(...perHour));
  const peakD = perDay.indexOf(Math.max(...perDay));
  const quietD = perDay.indexOf(Math.min(...perDay));
  const night = perHour.slice(0, 6).reduce((x, y) => x + y, 0);
  const weekend = perDay[5] + perDay[6];
  let streak = 0, run = 0;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  for (let i = 27; i >= 0; i--) {
    const d = new Date(today.getTime() - i * 86400000);
    const hit = (perDate.get(d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate()) || 0) > 0;
    run = hit ? run + 1 : 0;
    streak = Math.max(streak, run);
  }
  const pct = (v) => (total ? (v / total * 100).toFixed(0) + "%" : "—");
  const costTotal = recs.reduce((x, r) => x + (r.cost || 0), 0);
  const rows = [
    [t("r_peak_h"), `<span class="pflag" title="${t("r_tip_peak")}">${flagSVG()}</span> ` + peakH + ":00 · " + metricFmt(perHour[peakH])],
    [t("r_peak_d"), days[peakD] + " · " + metricFmt(perDay[peakD])],
    [t("r_quiet"), days[quietD] + " · " + metricFmt(perDay[quietD])],
    [t("r_night"), `<span class="fisher" title="${t("r_tip_night")}">${rodSVG()}</span> ` + pct(night)],
    [t("r_weekend"), pct(weekend)],
    [t("r_streak"), streak + "d"],
    [t("r_sess"), String(sessions.size)],
    [t("r_cost"), money(costTotal)],
  ];
  document.getElementById("rhythm").innerHTML =
    rows.map(([n, v]) => `<div class="rrow"><span class="rname">${n}</span><span class="rval">${v}</span></div>`).join("");
}

const COLS = [
  ["tool", "col_tool"], ["project", "col_project"], ["workspace", "col_workspace"], ["title", "col_title"],
  ["models", "col_models"], ["start", "col_start"], ["duration", "col_duration"],
  ["input", "col_input"], ["cacheRead", "col_cread"], ["output", "col_output"],
  ["active", "col_active"], ["total", "col_total"], ["cost", "col_cost"],
];
let lastRecs = [];
let lastSessN = 0; // receptionist gnome greets sessions arriving after this count

function renderTable(recs) {
  const groups = new Map();
  for (const r of recs) {
    const k = r.tool + ":" + r.session;
    if (!groups.has(k)) {
      groups.set(k, {
        tool: r.tool, session: r.session, title: r.title, project: r.project, workspace: r.workspace,
        models: new Set(), start: r.ts, end: r.ts,
        input: 0, cacheRead: 0, output: 0, active: 0, total: 0, cost: 0, costKnown: false, est: false,
      });
    }
    const g = groups.get(k);
    g.models.add(r.model);
    g.start = Math.min(g.start, r.ts); g.end = Math.max(g.end, r.ts);
    g.input += r.input; g.cacheRead += r.cacheRead; g.output += r.output;
    g.active += r.active ?? (r.input + r.output);
    g.total += totalOf(r);
    if (r.estimated) g.est = true;
    if (r.cost != null) { g.cost += r.cost; g.costKnown = true; }
  }
  lastRecs = [...groups.values()].map((g) => ({
    ...g, modelsTip: [...g.models].map(priceTip).join("\n\n"), models: [...g.models].join(", "), duration: g.end - g.start,
    cost: g.costKnown ? g.cost : null,
  }));
  lastRecs.sort((a, b) => {
    const x = a[state.sortKey], y = b[state.sortKey];
    if (x == null && y == null) return 0;
    if (x == null) return 1; if (y == null) return -1;
    return (x < y ? -1 : x > y ? 1 : 0) * state.sortDir;
  });
  let show = lastRecs.slice(0, state.shown);
  // Workspace column only earns its pixels when it differs from project
  // in the visible rows (hidden groups can't justify it).
  let showWs = show.some((g) => g.workspace && g.workspace !== g.project);
  if (!showWs && state.sortKey === "workspace") {
    state.sortKey = "project";
    lastRecs.sort((a, b) => {
      const x = a[state.sortKey], y = b[state.sortKey];
      if (x == null && y == null) return 0;
      if (x == null) return 1; if (y == null) return -1;
      return (x < y ? -1 : x > y ? 1 : 0) * state.sortDir;
    });
    show = lastRecs.slice(0, state.shown);
    showWs = show.some((g) => g.workspace && g.workspace !== g.project);
  }
  const cols = COLS.filter(([k]) => k !== "workspace" || showWs);
  const thead = document.querySelector("#sessions thead tr");
  thead.innerHTML = cols.map(([k, lbl]) => {
    const arrow = state.sortKey === k ? (state.sortDir === 1 ? " ▲" : " ▼") : "";
    const cls = ["input", "cacheRead", "output", "active", "total", "cost", "duration"].includes(k) ? ' class="num"' : "";
    return `<th data-k="${k}"${cls}>${t(lbl)}${arrow}</th>`;
  }).join("");
  thead.querySelectorAll("th").forEach((th) =>
    th.addEventListener("click", () => {
      const k = th.dataset.k;
      if (state.sortKey === k) state.sortDir *= -1;
      else { state.sortKey = k; state.sortDir = k === "tool" || k === "project" || k === "workspace" || k === "title" || k === "models" ? 1 : -1; }
      saveState(); renderTable(recs);
    })
  );
  const tbody = document.querySelector("#sessions tbody");
  tbody.innerHTML = show.map((g) => {
    const label = (g.title || g.session.slice(0, 8)) + (g.est ? " ~" : "");
    const tip = (g.title ? g.title + " · " + g.session : g.session) + (g.est ? " · incl. estimated" : "");
    const start = new Date(g.start).toLocaleString([], { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    const shortLabel = label.length > 40 ? label.slice(0, 40) + "…" : label;
    const shortModels = g.models.length > 40 ? g.models.slice(0, 40) + "…" : g.models;
    return `<tr>
      <td><span class="dot" style="background:${COLORS[g.tool]}"></span>${esc(g.tool)}</td>
      <td>${esc(g.project)}</td>
      ${showWs ? `<td>${esc(g.workspace)}</td>` : ""}
      <td title="${esc(tip)}">${esc(shortLabel)}</td>
      <td title="${esc(g.modelsTip)}">${esc(shortModels)}</td>
      <td>${start}</td><td>${dur(g.duration)}</td>
      <td class="num">${fmt(g.input)}</td><td class="num">${fmt(g.cacheRead)}</td>
      <td class="num">${fmt(g.output)}</td><td class="num">${fmt(g.active)}</td><td class="num">${fmt(g.total)}</td>
      <td class="num">${money(g.cost)}</td>
    </tr>`;
  }).join("");
  document.getElementById("more").style.display = lastRecs.length > state.shown ? "" : "none";
}

const LIVE = location.protocol === "http:";
let etag = null;
let lastOk = 0;
let offline = false;

function rerender() {
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

function tickLive() {
  const dot = document.getElementById("live-dot");
  const txt = document.getElementById("live-text");
  const lo = document.getElementById("lookout");
  const lookout = (mode, title) => {
    if (!lo) return;
    lo.className = "lookout " + mode;
    lo.title = title;
    if (!lo.innerHTML) lo.innerHTML = lookoutSVG();
  };
  if (!LIVE) {
    dot.style.background = "#888";
    txt.textContent = "Static snapshot · run npm run usage:serve for live";
    lookout("snooze", "Lookout off duty — static snapshot");
    return;
  }
  if (offline) {
    dot.style.background = "#ef4444";
    txt.textContent = lastOk ? `offline · updated ${Math.floor((Date.now() - lastOk) / 1000)}s ago` : "offline · connecting…";
    lookout("down", "Lookout lost the trail — reconnecting");
    return;
  }
  if (!lastOk) {
    dot.style.background = "#eab308";
    txt.textContent = "Live · connecting…";
    lookout("scope", "Lookout scanning for data…");
    return;
  }
  const s = Math.floor((Date.now() - lastOk) / 1000);
  const stale = s >= 30;
  dot.style.background = stale ? "#ef4444" : "#22c55e";
  txt.textContent = `Live · updated ${s}s ago`;
  lookout(stale ? "down" : "scope", stale ? "Lookout: trail gone cold" : "Lookout on duty — scanning live");
}

function setCourier(kind, title) {
  const c = document.getElementById("courier");
  if (!c) return;
  c.className = "courier " + kind;
  c.title = title;
  c.innerHTML = kind === "same" ? slateSVG() : parcelSVG();
}

let polling = false;
async function poll() {
  if (polling || document.hidden) return; // no overlap; hidden tabs skip work
  polling = true;
  try {
    const headers = {};
    if (etag) headers["If-None-Match"] = etag;
    const res = await fetch("/api/usage", { headers, cache: "no-store" });
    if (res.status === 200) {
      etag = res.headers.get("ETag");
      window.USAGE = await res.json();
      ALL = expand();
      refreshProjects();
      setMeta();
      lastOk = Date.now();
      offline = false;
      setCourier("fresh", "Courier delivered fresh records");
      rerender();
    } else if (res.status === 304) {
      lastOk = Date.now();
      offline = false;
      setCourier("same", "Courier reports: nothing new on the server");
      if (state.preset !== "custom") rerender(); // rolling range: "now" moved
    } else {
      offline = true;
    }
  } catch {
    offline = true;
  } finally {
    polling = false;
  }
  tickLive();
}

function startLive() {
  poll();
  setInterval(poll, 10000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
  setInterval(tickLive, 1000);
}

function initTheme() {
  document.getElementById("theme").addEventListener("change", (e) => {
    const next = THEMES.includes(e.target.value) ? e.target.value : "auto";
    try { localStorage.setItem(THEME_KEY, next); } catch { /* private mode */ }
    applyTheme();
  });
  try {
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (themePref() === "auto") applyTheme();
    });
  } catch { /* older browsers */ }
  applyTheme();
}

function initSettingsDialog() {
  const dialog = document.getElementById("settings-dialog");
  const open = document.getElementById("settings-open");
  const close = document.getElementById("settings-close");
  open.addEventListener("click", () => dialog.showModal());
  close.addEventListener("click", () => dialog.close());
  dialog.addEventListener("click", (event) => {
    if (event.target === dialog) dialog.close();
  });
}

async function loadInstalledCrews() {
  // The local server discovers direct .js files in both crews/ and the
  // gitignored crews/private/. Placing code there is an explicit install and
  // trust decision; review third-party crew files before adding them.
  try {
    const response = await fetch("/api/crews", { cache: "no-store" });
    if (!response.ok) return;
    const urls = await response.json();
    const loaded = new Set([...document.scripts].map((script) => {
      try { return new URL(script.src).pathname; } catch { return ""; }
    }));
    for (const url of urls) {
      if (loaded.has(url)) continue;
      await new Promise((resolve) => {
        const script = document.createElement("script");
        script.src = url;
        script.onload = resolve;
        script.onerror = resolve;
        document.head.appendChild(script);
      });
    }
  } catch { /* static snapshots and older servers retain built-in gnomes */ }
}

function boot() {
  if (!window.USAGE && !LIVE) {
    document.getElementById("nousage").hidden = false;
    document.getElementById("nousage").insertAdjacentHTML("afterbegin", shrugSVG());
    loadState(); buildToolControls(); syncControls(); applyLang(); initTheme(); initSettingsDialog();
    return;
  }
  document.getElementById("app").hidden = false;
  if (window.USAGE) ALL = expand();
  init();
  initSettingsDialog();
  if (LIVE) startLive();
  tickLive();
}

if (LIVE) {
  // Load installed public/private crews before restoring the selected style.
  loadInstalledCrews().finally(boot); // data arrives via /api/usage; no data.js request
} else {
  // Static snapshot (file://): fetch the generated payload next to this file.
  const s = document.createElement("script");
  s.src = "./data.js";
  s.onload = boot;
  s.onerror = boot; // window.USAGE stays unset -> "run npm run usage" message
  document.head.appendChild(s);
}
</script>
