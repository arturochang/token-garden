<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Garden</title>
<!-- data.js loads dynamically below (static snapshots only); live mode uses /api/usage -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="./i18n/en.js"></script>
<script src="./i18n/zh-Hant.js"></script>
<script src="./crews/registry.js"></script>
<script src="./crews/gnomes.js"></script>
<style>
  :root, :root[data-theme="light"] {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --card: #f5f5f5;
    --border: #ddd; --up: #b91c1c; --down: #15803d;
  }
  :root[data-theme="dark"] {
    --bg: #111113; --fg: #c6c6ce; --muted: #9a9aa3; --card: #1c1c1f;
    --border: #333; --up: #f87171; --down: #4ade80;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111113; --fg: #c6c6ce; --muted: #9a9aa3; --card: #1c1c1f;
      --border: #333; --up: #f87171; --down: #4ade80;
    }
  }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 16px; }
  #topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  #topbar h1 { font-size: 2.3rem; font-weight: 800; letter-spacing: -0.5px; margin: 0; align-self: center; line-height: 1.1; }
  #topbar #crew { margin-left: 12px; padding-top: 8px; }
  /* Blanked heading takes no box; drop its flex gap and the crew's own
     offset so the crew lines up flush left with the KPI tiles below. */
  #topbar h1:empty { display: none; }
  #topbar h1:empty + #crew { margin-left: 0; }
  #top-controls { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #settings-open { white-space: nowrap; }
  #controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; position: sticky; top: 0; z-index: 50; background: var(--bg); padding: 8px 0; }
  #controls .group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  button { cursor: pointer; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--fg); }
  button.active { background: var(--fg); color: var(--bg); }
  input, select { padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--fg); }
  label { font-size: 0.85rem; }
  dialog { color: var(--fg); background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0; width: min(460px, calc(100vw - 32px)); box-shadow: 0 18px 60px rgba(0,0,0,.35); }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  .settings-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .settings-head h2 { margin: 0; font-size: 1.05rem; }
  .settings-body { display: grid; gap: 14px; padding: 16px; }
  .setting-row { display: grid; grid-template-columns: minmax(90px, 34%) minmax(0,1fr); gap: 12px; align-items: center; }
  .setting-row > span { color: var(--muted); font-size: .82rem; }
  .setting-row:has(#tools) { align-items: start; }
  .setting-row:has(#tools) > span { padding-top: 7px; } /* align with the first harness row, not the whole stack */
  #tools { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .harness-option { display: flex; align-items: center; gap: 7px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; }
  .harness-option.toggle-option { width: fit-content; }
  .harness-option .dot { margin: 0; }
  #kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .kpi .name { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; }
  .kpi .val { font-size: 1.25rem; font-weight: 700; }
  .kpi .delta { font-size: 0.75rem; }
  .delta.up { color: var(--up); } .delta.down { color: var(--down); } .delta.flat { color: var(--muted); }
  .charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; min-width: 0; }
  @media (max-width: 900px) { .charts { grid-template-columns: minmax(0, 1fr); } }
  .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; min-width: 0; max-width: 100%; overflow: hidden; }
  .chart-box h3 { margin: 0 0 6px; font-size: 0.9rem; }
  .chart-box h3 select.chart-opt { font-size: 0.75rem; font-weight: normal; padding: 1px 4px; margin-left: 4px; }
  .chart-box canvas { max-height: 260px; max-width: 100%; width: 100% !important; height: auto !important; display: block; }
  .chart-box[data-sec="heat"], .chart-box[data-sec="sessions"], .chart-box[data-sec="pricebook"] { overflow-x: auto; }
  .pricemeta { font-size: 0.72rem; font-weight: normal; color: var(--muted); }
  #pricebook table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  #pricebook th, #pricebook td { padding: 4px 8px; text-align: right; white-space: nowrap; }
  #pricebook th:first-child, #pricebook td:first-child { text-align: left; }
  #pricebook tbody tr { border-top: 1px solid var(--border); }
  #pricebook .src { font-size: 0.72rem; color: var(--muted); }
  #pricebook .src.live { color: var(--down); }
  #controls input, #controls select { max-width: 100%; }
  .picker summary { cursor: pointer; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--fg); list-style: none; font-size: 0.85rem; }
  .picker summary::-webkit-details-marker { display: none; }
  .picker summary::after { content: " ▾"; }
  .picker[open] summary::after { content: " ▴"; }
  .picker-menu { position: absolute; margin-top: 4px; padding: 8px; display: grid; gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 60; min-width: 160px; }
  .picker-menu label { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; white-space: nowrap; }
  .picker-menu .picker-actions { display: flex; gap: 6px; margin-top: 4px; border-top: 1px solid var(--border); padding-top: 6px; }
  .picker-menu .picker-actions button { flex: 1; font-size: 0.75rem; padding: 3px 6px; }
  #heatmap { display: grid; grid-template-columns: 40px repeat(24, minmax(10px, 26px)); justify-content: start; gap: 2px; font-size: 0.65rem; }
  #heatwrap { display: flex; gap: 18px; flex-wrap: wrap; align-items: start; }
  #rhythm { flex: 0 1 340px; min-width: 210px; font-size: 0.8rem; align-self: center; }
  #rhythm .rrow { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-bottom: 1px solid var(--border); }
  #rhythm .rrow:last-child { border-bottom: none; }
  #rhythm .rname { color: var(--muted); }
  #rhythm .rval { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #heatmap .cell { aspect-ratio: 1; border-radius: 2px; min-width: 8px; }
  #heatmap .lbl { color: var(--muted); align-self: center; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  th { cursor: pointer; text-align: left; border-bottom: 2px solid var(--border); padding: 4px 6px; white-space: nowrap; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td { border-bottom: 1px solid var(--border); padding: 4px 6px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
  #nousage { font-size: 1.1rem; padding: 40px; text-align: center; }
  #meta { color: var(--muted); font-size: 0.8rem; margin-bottom: 10px; }
  #live { margin-right: 10px; white-space: nowrap; }
  #live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  #crew { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; padding-top: 4px; }
  #crew[hidden] { display: none; }
  .gnome { display: flex; align-items: center; gap: 8px; width: auto; text-align: left; padding: 5px 12px 5px 7px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); cursor: pointer; position: relative; }
  .gnome svg { width: 52px; height: 52px; display: block; margin: 0; overflow: visible; flex: none; }
  .gnome .cinfo { display: flex; flex-direction: column; gap: 1px; }
  .gnome .tlabel { font-size: 0.68rem; color: var(--muted); line-height: 1.2; }
  .gnome .rlabel { font-size: 0.72rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
  /* Crew faces: exactly one of .f-work/.f-idle/.f-frenzy shows per state. */
  .gnome .f-idle, .gnome .f-frenzy { display: none; }
  .gnome.idle .f-work, .gnome.off .f-work, .gnome.frenzy .f-work { display: none; }
  .gnome.idle .f-idle, .gnome.off .f-idle { display: inline; }
  .gnome.frenzy:not(.idle):not(.off) .f-frenzy { display: inline; }
  .gnome .bob { animation: gbob var(--spd, 1.2s) ease-in-out infinite; }
  .gnome .swing { animation: gswing var(--spd, 1.2s) ease-in-out infinite; transform-box: fill-box; transform-origin: 15% 85%; }
  @keyframes gbob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes gswing { 0%, 100% { transform: rotate(-18deg); } 50% { transform: rotate(24deg); } }
  .gnome.idle svg { transform: rotate(18deg) translateY(5px); filter: grayscale(0.75); opacity: 0.7; }
  .gnome.idle .bob, .gnome.idle .swing { animation-play-state: paused; }
  .gnome .zzz { display: none; position: absolute; top: -8px; right: 8px; font-size: 0.75rem; font-weight: 700; color: var(--muted); }
  .gnome.idle .zzz { display: block; animation: zfloat 2.2s ease-in-out infinite; }
  @keyframes zfloat { 0% { transform: translateY(2px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-8px); opacity: 0; } }
  .gnome.off { opacity: 0.3; filter: grayscale(1); }
  .gnome.off .bob, .gnome.off .swing { animation-play-state: paused; }
  .gnome .dust { display: none; position: absolute; bottom: 8px; left: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }  .gnome.frenzy .dust { display: block; animation: dpuff var(--spd, 0.5s) ease-out infinite; }
  .gnome.frenzy .d2 { animation-delay: calc(var(--spd, 0.5s) / 2); }
  @keyframes dpuff { 0% { transform: translate(0, 0) scale(1); opacity: 0.8; } 100% { transform: translate(-14px, -4px) scale(0.3); opacity: 0; } }
  .gnome.frenzy .bob, .gnome.frenzy .swing { animation-timing-function: linear; }
  .gnome .haul { display: flex; align-items: center; gap: 4px; margin: 0; min-height: 0; }
  .gnome .sack { color: #e0a100; line-height: 1; }
  .porter { display: inline-block; vertical-align: -2px; margin-right: 2px; }
  .porter .ghead, .porter .ahead { width: 100%; height: auto; display: block; }  .gnome .cart { width: 22px; height: 5px; border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
  .gnome .cart i { display: block; height: 100%; background: #4caf7d; }
  .kpi { position: relative; }
  .kpi .name { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 30px; }
  .kpi .name .nametext { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .kpi .val { white-space: nowrap; }
  .mascot { display: flex; align-items: center; height: 30px; flex: none; overflow: visible; }
  .mascot .ghead, .mascot .ahead, .acct .ghead, .acct .ahead, .recep > .ghead, .recep > .ahead, .lift .ghead, .lift .ahead { width: 30px; height: 30px; display: block; overflow: visible; flex: none; }
  .wheel { position: relative; width: 28px; height: 28px; display: block; flex: none; }
  .wheel .rim { position: absolute; inset: 0; border: 2px dashed var(--muted); border-radius: 50%; animation: wspin var(--wspd, 0.8s) linear infinite; }
  @keyframes wspin { to { transform: rotate(360deg); } }
  .wheel .ham { position: absolute; inset: 6px; animation: gbob var(--wspd, 0.8s) ease-in-out infinite; }
  .wheel .ham .ghead, .wheel .ham .ahead { width: 100%; height: 100%; }
  .wheel .sweat { display: none; position: absolute; top: -2px; right: -3px; width: 4px; height: 6px; border-radius: 50%; background: #7cc4ff; }
  .wheel.pant .ham { animation-play-state: paused; transform: rotate(24deg); }
  .wheel.pant .rim { animation-duration: calc(var(--wspd, 0.8s) * 3); }
  .wheel.pant .sweat { display: block; animation: zfloat 1.6s ease-in-out infinite; }
  .acct { position: relative; display: block; width: 30px; height: 30px; flex: none; }
  .acct .stmp { position: absolute; right: -5px; bottom: 0px; width: 13px; height: 13px; border-radius: 3px; background: #4caf7d; color: #fff; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; animation: stamp 2.4s ease-in-out infinite; }
  .acct.audit .stmp { background: #e0a100; border-radius: 50%; }
  @keyframes stamp { 0%, 100% { transform: translateY(-3px) scale(1); } 12% { transform: translateY(1px) scale(1.25); } 24% { transform: translateY(-3px) scale(1); } }
  .lift { display: flex; align-items: center; gap: 5px; }
  .lift .bar { position: relative; height: 4px; background: #9aa0a6; border-radius: 2px; animation: strain 0.9s ease-in-out infinite; }
  .lift .bar i { position: absolute; top: -3px; width: 3px; height: 10px; background: #9aa0a6; border-radius: 1px; }
  .lift .bar i:first-child { left: 0; } .lift .bar i:last-child { right: 0; }
  @keyframes strain { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
  .recep { position: relative; display: block; }
  .recep .wave { position: absolute; top: 3px; right: -5px; width: 5px; height: 9px; border-radius: 3px; background: #f2c9a0; transform-origin: bottom center; animation: wavehi 1.2s ease-in-out infinite; }
  @keyframes wavehi { 0%, 100% { transform: rotate(-25deg); } 50% { transform: rotate(30deg); } }
  .recep .guest { position: absolute; left: -11px; bottom: -4px; width: 15px; height: 15px; animation: guestpop 0.5s ease-out; }
  .recep .guest .ghead, .recep .guest .ahead { width: 100%; height: 100%; }
  @keyframes guestpop { 0% { transform: translateY(8px) scale(0.4); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .pflag { display: inline-block; vertical-align: -2px; animation: flagwave 2s ease-in-out infinite; transform-origin: left center; }
  @keyframes flagwave { 0%, 100% { transform: skewX(0); } 50% { transform: skewX(-8deg); } }
  .fisher svg, .pflag svg { width: 14px; height: 14px; vertical-align: -2px; }
  #heatmap .cell { position: relative; overflow: hidden; }
  #heatmap .cell.stilly::after { content: "≈"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--muted); opacity: 0.55; }
  #heatmap .cell.strike { outline: 2px solid #e0a100; outline-offset: -2px; }
  .lookout { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; }
  .lookout svg { width: 100%; height: 100%; }
  .lookout.scope svg { animation: scan 3s ease-in-out infinite; transform-origin: center; }
  @keyframes scan { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  .lookout.snooze { filter: grayscale(1); opacity: 0.6; }
  .lookout.snooze svg { transform: rotate(20deg); }
  .lookout.down { opacity: 0.5; }
  .lookout.down svg { transform: rotate(35deg); }
  .courier { display: inline-block; width: 15px; height: 15px; vertical-align: -2px; margin-left: 6px; }
  .courier svg { width: 100%; height: 100%; }
  .courier.fresh svg { animation: guestpop 0.5s ease-out; }
  #subbaby { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-left: 2px; }
  #subbaby .ghead, #subbaby .ahead { width: 100%; height: 100%; }
  #sub:not(:checked) ~ #subbaby { opacity: 0.15; filter: grayscale(1); }
  .clerk { display: none; width: 18px; height: 18px; vertical-align: -3px; margin-left: 4px; }
  .clerk svg { width: 100%; height: 100%; }
  body.custom-range .clerk { display: inline-block; }
  .merch { position: relative; display: block; }
  .merch .tag { position: absolute; right: -7px; bottom: 0px; background: #e0a100; color: #111; font-size: 8px; font-weight: 700; border-radius: 2px; padding: 0 2px; }
  .merch.faint { transform: rotate(25deg); filter: saturate(0.4); }
  .bucket svg { width: 18px; height: 18px; display: block; }
  .bucket.full svg { animation: slosh 1.4s ease-in-out infinite; transform-origin: top center; }
  @keyframes slosh { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  #mtdglass svg { width: 11px; height: 16px; vertical-align: -3px; }
  .shrug { width: 26px; height: 26px; vertical-align: middle; margin-right: 6px; }
  .wrestle { display: inline-flex; align-items: center; margin-left: 6px; vertical-align: -3px; }
  .wrestle .ghead, .wrestle .ahead { width: 19px; height: 19px; }
  .wrestle .ghead:first-of-type, .wrestle .ahead:first-of-type { transform: rotate(-12deg); animation: strain 0.9s ease-in-out infinite; }
  .wrestle .ghead:last-of-type, .wrestle .ahead:last-of-type { transform: rotate(12deg); animation: strain 0.9s ease-in-out infinite reverse; }
  .wrestle .vs { font-size: 0.6rem; color: var(--muted); margin: 0 2px; }
  .spark { width: 100%; height: 18px; display: block; margin: 2px 0 6px; opacity: 0.85; }
  .fold { padding: 0 6px; margin-right: 6px; font-size: 0.75rem; }
  /* Page pet: a crew-owned buddy roaming the bottom of the viewport. */
  #pagepet { position: fixed; left: 0; bottom: 8px; z-index: 150; width: 140px; height: 146px; pointer-events: auto; cursor: pointer; }
  #pagepet #petfig { display: block; width: 140px; height: 146px; }
  #pagepet #petfig svg { width: 100%; height: 100%; overflow: visible; }
  #pagepet .pzzz { display: none; position: absolute; top: -10px; right: 10px; font-size: 0.8rem; font-weight: 700; color: var(--muted); animation: zfloat 2.2s ease-in-out infinite; }
  #pagepet[data-mode="nap"] .pzzz { display: block; }
  #pagepet[data-mode="nap"] #petfig { animation: petbreathe 2.4s ease-in-out infinite; transform-origin: bottom center; }
  @keyframes petbreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04, 0.97); } }
  #petbubble { position: absolute; bottom: 148px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 2px 8px; font-size: 0.75rem; white-space: nowrap; }
  #petbubble[hidden] { display: none; }
  .chart-box.shut > :not(h3) { display: none; }
  body.napping *, body.napping *::before, body.napping *::after { animation-play-state: paused !important; }
  body.nognomes .mascot, body.nognomes .porter, body.nognomes .pflag, body.nognomes .fisher,
  body.nognomes .clerk, body.nognomes #subbaby, body.nognomes #lookout, body.nognomes #courier,
  body.nognomes #mtdglass, body.nognomes .wrestle, body.nognomes .shrug,
  body.nognomes #pagepet { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .gnome .bob, .gnome .swing, .gnome .dust, .gnome.idle .zzz, .wheel .rim, .wheel .ham, .acct .stmp, .lift .bar, .recep .wave, .pflag, .lookout.scope svg, .courier.fresh svg, .bucket.full svg { animation: none; } }
</style>
</head>
<body>
<div id="topbar"><h1 id="pageheading">Token Garden</h1><div id="crew" title="Crew work speed follows active tokens/sec per tool"></div><div id="top-controls"><button id="settings-open" type="button" data-k="settings">Settings</button></div></div>
<dialog id="settings-dialog" aria-labelledby="settings-title">
  <div class="settings-head"><h2 id="settings-title" data-k="settings">Settings</h2><button id="settings-close" type="button" aria-label="Close">×</button></div>
  <div class="settings-body">
    <label class="setting-row"><span data-k="theme">Theme</span><select id="theme"><option value="auto" data-k="theme_auto">Auto</option><option value="dark" data-k="theme_dark">Dark</option><option value="light" data-k="theme_light">Light</option></select></label>
    <label class="setting-row"><span data-k="language">Language</span><select id="lang"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select></label>
    <label class="setting-row"><span data-k="style_label">Crew style</span><select id="crewstyle"><option value="gnomes" data-k="crew_gnomes">gnomes</option></select></label>
    <label class="setting-row"><span data-k="crew_visible">Show crew</span><span class="harness-option toggle-option"><input type="checkbox" id="gnomes" checked></span></label>
    <div class="setting-row"><span data-k="harnesses">Harnesses</span><div id="tools"></div></div>
    <label class="setting-row"><span data-k="sub">Include subagents</span><span><input type="checkbox" id="sub" checked> <span id="subbaby" title="Baby handles subagent records — ghosts when excluded"></span></span></label>
    <label class="setting-row"><span data-k="hide_heading">Hide heading</span><span class="harness-option toggle-option"><input type="checkbox" id="hideheading"></span></label>
    <label class="setting-row"><span data-k="heading_text">Heading text</span><input type="text" id="headingtext" maxlength="60" placeholder="Token Garden"></label>
    <label class="setting-row"><span data-k="tabtitle_text">Tab title</span><input type="text" id="tabtitletext" maxlength="60" placeholder="Token Garden"></label>
  </div>
</dialog>
<div id="pagepet" data-mode="sit" title="Page pet: click to say hi"><div id="petbubble" hidden></div><span id="petfig"></span><span class="pzzz">z</span></div>
<div id="nousage" hidden><span data-k="nousage">Run <code>npm run usage</code> first.</span></div>
<div id="app" hidden>
  <div id="meta"><span id="live"><span id="lookout"></span><span id="live-dot"></span><span id="live-text"></span></span><span id="meta-text"></span><span id="courier"></span></div>
  <div id="controls">
    <div class="group" id="presets">
      <button data-range="1h">1h</button>
      <button data-range="3h">3h</button>
      <button data-range="6h">6h</button>
      <button data-range="today" data-k="today">Today</button>
      <button data-range="7d">7d</button>
      <button data-range="30d" class="active">30d</button>
      <button data-range="90d">90d</button>
      <button data-range="all" data-k="all">All</button>
    </div>
    <div class="group">
      <label><span data-k="from">from</span> <input type="date" id="from"></label>
      <label><span data-k="to">to</span> <input type="date" id="to"><span class="clerk" title="Custom-range clerk on duty"></span></label>
    </div>
    <div class="group">
      <label><span data-k="project">project</span> <select id="project"><option value="">All</option></select></label>
    </div>
    <div class="group">
      <details id="tiles-picker" class="picker">
        <summary data-k="tiles">Tiles</summary>
        <div id="tiles-menu" class="picker-menu"></div>
      </details>
    </div>
  </div>
  <div id="kpis"></div>
  <div class="charts">
    <div class="chart-box" data-sec="tokens"><h3><span class="t" data-k="c_tokens">Tokens over time</span> <button id="logt" title="Toggle log scale">log</button> <button id="prevt" title="Toggle previous-period overlay">prev</button></h3><canvas id="c-tokens"></canvas></div>
    <div class="chart-box" data-sec="cost"><h3><span class="t" data-k="c_cost">Cost over time</span> <button id="logc" title="Toggle log scale">log</button> <button id="prevc" title="Toggle previous-period overlay">prev</button></h3><canvas id="c-cost"></canvas></div>
    <div class="chart-box" data-sec="mix"><h3><span class="t" data-k="c_mix">Token mix by tool</span> <button id="mixpct" title="Toggle absolute / percent stacked">%</button></h3><canvas id="c-mix"></canvas></div>
    <div class="chart-box" data-sec="models"><h3><span class="t" id="group-title" data-k="g_top_model">Top models</span> <select id="group" class="chart-opt">
        <option value="model" data-k="g_model">model</option>
        <option value="project" data-k="g_project">project</option>
        <option value="workspace" data-k="g_workspace">workspace</option>
        <option value="tool+model" data-k="g_toolmodel">tool+model</option>
        <option value="workspace+model" data-k="g_wmodel">workspace+model</option>
      </select></h3><canvas id="c-models"></canvas></div>
    <div class="chart-box" data-sec="costmodels"><h3><span class="t" data-k="c_costmodels">Top cost by model</span></h3><canvas id="c-costmodels"></canvas></div>
    <div class="chart-box" data-sec="mtd"><h3><span class="t" data-k="c_mtd">Spend month-to-date</span> <span id="mtdglass"></span></h3><canvas id="c-mtd"></canvas></div>
    <div class="chart-box" data-sec="hit"><h3><span class="t" data-k="c_hit">Cache hit rate trend</span></h3><canvas id="c-hit"></canvas></div>
    <div class="chart-box" data-sec="topsess"><h3><span class="t" data-k="c_topsess">Most expensive sessions</span></h3><div id="topsess"></div></div>
  </div>
  <div class="chart-box" data-sec="heat" style="margin-bottom:14px"><h3><span class="t" data-k="c_heat">Activity heatmap — trailing 28d (day × hour)</span> <select id="metric" style="font-size:0.8rem;font-weight:normal"><option value="tokens" data-k="m_tokens">tokens</option><option value="active" data-k="m_active">active</option><option value="cost" data-k="m_cost">cost</option></select></h3><div id="heatwrap"><div id="heatmap"></div><div id="rhythm"></div></div></div>
  <div class="chart-box" data-sec="sessions"><h3><span class="t" data-k="c_sess">Sessions</span></h3>
    <table id="sessions"><thead><tr></tr></thead><tbody></tbody></table>
    <button id="more" style="margin-top:8px" data-k="more">show more</button>
  </div>
  <div class="chart-box" data-sec="pricebook"><h3><span class="t" data-k="c_pricebook">Price book</span> <span id="pricemeta" class="pricemeta"></span></h3>
    <div id="pricebook"></div>
  </div>
</div>
<script>
// Harness UI extension point: add one stable lowercase id and color here.
const TOOL_CONFIG = {
  claude: { label: "claude", color: "#D97757" },
  codex: { label: "codex", color: "#10A37F" },
  opencode: { label: "opencode", color: "#6E56CF" },
};
const TOOLS = Object.keys(TOOL_CONFIG);
const COLORS = Object.fromEntries(TOOLS.map((id) => [id, TOOL_CONFIG[id].color]));

// KPI tile ids, in display order. Each maps to a "k_<id>" i18n key used both
// as the tile heading and as the label in the tile-visibility picker.
const KPI_IDS = ["total", "active", "burn", "input", "cread", "cwrite", "output", "hit", "cost", "cov", "sess", "avg"];

// i18n: per-locale dictionaries live in i18n/<tag>.js (loaded via <script>
// tags above so both file:// snapshots and the live server work without
// fetch/CORS issues). To add a language: copy i18n/en.js, translate values
// (keys stay), add the tag to LOCALES + a <script> line. Units (k/M/B, $,
// m/h/d, tokens/s) stay English in all locales.
const LOCALES = ["en", "zh-Hant"];
const STRINGS = window.STRINGS || { en: {} };
// t("key", { n: 3 }) fills {n}-style placeholders in the localized string.
function t(key, vars) {
  const lang = LOCALES.includes(state.lang) ? state.lang : "en";
  const s = (STRINGS[lang] && STRINGS[lang][key]) ?? STRINGS.en[key] ?? key;
  return vars ? s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] ?? m)) : s;
}
// Log content includes user prompts and filesystem-derived names. Escape it
// before inserting it into HTML, even though the dashboard is local-only.
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[ch]);
}
// Locale for date/time rendering only; numeric/unit formatting stays English.
function localeTag() { return state.lang === "zh-Hant" ? "zh-Hant-TW" : "en"; }
function detectLang() {
  try {
    const n = (navigator.language || "").toLowerCase().replace("_", "-");
    if (/^zh(-|_)?(hant|tw|hk|mo)/.test(n) || n === "zh-hant") return "zh-Hant";
  } catch { /* ignore */ }
  return "en";
}
// Push every static (data-k) string + titles to match state.lang.
function applyLang() {
  document.documentElement.lang = state.lang === "zh-Hant" ? "zh-Hant" : "en";
  document.querySelectorAll("[data-k]").forEach((el) => {
    if (el.id === "group-title") return; // dynamic per group-by; renderModels owns it
    const v = t(el.dataset.k);
    if (el.tagName === "OPTION" && el.value === "" && el.closest("#project")) { el.textContent = t("all"); return; }
    el.innerHTML = v;
  });
  const setTitle = (id, key) => { const el = document.getElementById(id); if (el) el.title = t(key); };
  setTitle("gnomes", "tip_gnomes"); setTitle("crewstyle", "tip_crewstyle"); setTitle("theme", "tip_theme"); setTitle("crew", "tip_crew");
  setTitle("subbaby", "tip_subbaby"); setTitle("logt", "tip_log"); setTitle("logc", "tip_log");
  setTitle("prevt", "tip_prev"); setTitle("prevc", "tip_prev"); setTitle("mixpct", "tip_mix");
  setTitle("group", "groupby"); { const g = document.getElementById("group"); if (g) g.setAttribute("aria-label", t("groupby")); }
  document.querySelectorAll(".clerk").forEach((el) => { el.title = t("tip_clerk"); });
  document.querySelectorAll(".fold").forEach((el) => { el.title = t("tip_fold"); });
  const ls = document.getElementById("lang");
  if (ls) ls.value = state.lang;
  refreshGnomeBtn(); refreshCrewBtn(); applyTheme(); tickLive();
}

// String pool: session/title/project/model/workspace/tool repeat across
// ~43k records but only ~1k distinct values. Sharing one reference each
// instead of a heap string per record saves tens of MB.
const STRPOOL = new Map();
function intern(s) {
  if (typeof s !== "string") return s;
  const hit = STRPOOL.get(s);
  if (hit !== undefined) return hit;
  STRPOOL.set(s, s);
  return s;
}

function expand() {
  const { fields, rows } = window.USAGE;
  const out = rows.map((r) => {
    const o = {};
    fields.forEach((f, i) => (o[f] = r[i]));
    for (const f of ["tool", "session", "title", "project", "model", "workspace"]) {
      if (typeof o[f] === "string") o[f] = intern(o[f]);
    }
    o.workspace ??= o.project ?? "unknown";
    o.reasoningSeparate ??= o.tool === "opencode" ? 1 : 0; // old snapshot compatibility
    o.active ??= (o.input || 0) + (o.output || 0) + (o.reasoningSeparate ? o.reasoning || 0 : 0);
    o.estimated ??= 0;
    return o;
  });
  window.USAGE.rows = null; // ALL is now the single copy; free the raw arrays
  return out;
}

function fmt(n) {
  if (n == null) return "—";
  if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(2).replace(/\.?0+$/, "") + "B";
  if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "k";
  return String(Math.round(n * 10) / 10);
}
function money(n) { return n == null ? "—" : "$" + n.toFixed(2); }

// Price book lookup + tooltip text, shared by every spot a model name is
// rendered (charts, tables, the merchant tile, the Price book section).
// window.USAGE.prices is a one-entry-per-distinct-model map built server
// side in collect.mjs; older data.js snapshots simply lack it.
function priceInfo(model) {
  const book = window.USAGE && window.USAGE.prices;
  return (book && book[model]) || null;
}
function priceAge(fetchedAt) {
  if (!fetchedAt) return "";
  const mins = Math.max(0, Math.round((Date.now() - fetchedAt) / 60000));
  if (mins < 60) return mins + "m";
  const hrs = Math.round(mins / 60);
  return hrs + "h";
}
// One-line tooltip: rates per 1M tokens, plus source (live LiteLLM snapshot,
// age-stamped, vs. the built-in fallback table) so a number can be trusted
// or distrusted at a glance.
function priceTip(model) {
  const info = priceInfo(model);
  const meta = (window.USAGE && window.USAGE.priceMeta) || {};
  if (!info) {
    return t("price_none", { model });
  }
  const p = info.price;
  const rates = state.lang === "zh-Hant"
    ? `輸入 ${money(p.input)}／輸出 ${money(p.output)}／快取讀 ${money(p.cacheRead)}／快取寫 ${money(p.cacheWrite)}（每 1M token）`
    : `${money(p.input)} in / ${money(p.output)} out / ${money(p.cacheRead)} cache-read / ${money(p.cacheWrite)} cache-write per 1M`;
  const age = priceAge(meta.fetchedAt);
  const source = info.live
    ? (age ? t("price_src_live_age", { age }) : t("price_src_live"))
    : t("price_src_builtin");
  return `${model}\n${rates}\n${source}`;
}
function totalOf(r) {
  return r.input + r.cacheRead + r.cacheWrite + r.output + (r.reasoningSeparate ? r.reasoning : 0);
}
function dur(ms) {
  if (ms <= 0) return "—";
  const m = Math.round(ms / 60000);
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h" + (m % 60 ? (m % 60) + "m" : "");
  return Math.floor(h / 24) + "d" + (h % 24 ? (h % 24) + "h" : "");
}

const state = {
  lang: "en",
  preset: "30d",
  tools: new Set(TOOLS),
  kpis: new Set(KPI_IDS),
  project: "",
  group: "model",
  metric: "tokens",
  mixPct: false,
  logT: false,
  logC: false,
  prevT: true,
  prevC: true,
  gnomes: true,
  crewStyle: "gnomes",
  collapsed: [],
  includeSub: true,
  sortKey: "total",
  sortDir: -1,
  shown: 50,
  headingText: "",
  hideHeading: false,
  tabTitleText: "",
};
const DEFAULT_TITLE = "Token Garden";

const LS_KEY = "usage-state-v1";
function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      updatedAt: Date.now(),
      lang: state.lang,
      preset: state.preset,
      tools: [...state.tools],
      kpis: [...state.kpis],
      project: state.project,
      group: state.group,
      metric: state.metric,
      mixPct: state.mixPct,
      logT: state.logT,
      logC: state.logC,
      prevT: state.prevT,
      prevC: state.prevC,
      gnomes: state.gnomes,
      crewStyle: state.crewStyle,
      collapsed: state.collapsed,
      includeSub: state.includeSub,
      sortKey: state.sortKey,
      sortDir: state.sortDir,
      headingText: state.headingText,
      hideHeading: state.hideHeading,
      tabTitleText: state.tabTitleText,
      from: document.getElementById("from")?.value || "",
      to: document.getElementById("to")?.value || "",
    }));
  } catch { /* private mode */ }
  pushPrefs();
}
// Local copy is instant; the server copy follows (debounced) so settings
// survive restarts, port changes and other browsers. No location = no server.
let prefsTimer = 0;
function pushPrefs() {
  try {
    if (typeof location === "undefined" || location.protocol !== "http:") return;
    clearTimeout(prefsTimer);
    prefsTimer = setTimeout(() => {
      try {
        const body = localStorage.getItem(LS_KEY) || "{}";
        fetch("/api/prefs", { method: "POST", headers: { "Content-Type": "application/json" }, body }).catch(() => {});
      } catch { /* offline */ }
    }, 500);
  } catch { /* ignore */ }
}
// Server copy wins when newer (last write across any browser/port).
async function pullPrefs() {
  try {
    if (typeof location === "undefined" || location.protocol !== "http:") return;
    const res = await fetch("/api/prefs", { cache: "no-store" });
    if (!res.ok) return;
    const p = await res.json();
    let local = null;
    try { local = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch { /* ignore */ }
    if (p && typeof p === "object" && (p.updatedAt || 0) > ((local && local.updatedAt) || 0)) {
      if (applyPrefs(p)) {
        try { localStorage.setItem(LS_KEY, JSON.stringify(p)); } catch { /* ignore */ }
        syncControls();
        applyLang();
        rerender();
      }
    }
  } catch { /* offline: local copy stands */ }
}
function loadState() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch { s = null; }
  if (!applyPrefs(s)) state.lang = detectLang();
  else if (!s.lang) state.lang = detectLang(); // existing saves predate i18n
}
function applyPrefs(s) {
  if (!s || typeof s !== "object") return false;
  if (typeof s.lang === "string" && LOCALES.includes(s.lang)) state.lang = s.lang;
  if (typeof s.preset === "string") state.preset = s.preset;
  if (Array.isArray(s.tools)) state.tools = new Set(s.tools.filter((t) => TOOLS.includes(t)));
  if (Array.isArray(s.kpis)) state.kpis = new Set(s.kpis.filter((k) => KPI_IDS.includes(k)));
  if (typeof s.project === "string") state.project = s.project;
  if (typeof s.group === "string") state.group = s.group;
  if (typeof s.metric === "string" && ["tokens", "active", "cost"].includes(s.metric)) state.metric = s.metric;
  if (typeof s.mixPct === "boolean") state.mixPct = s.mixPct;
  if (typeof s.logT === "boolean") state.logT = s.logT;
  if (typeof s.logC === "boolean") state.logC = s.logC;
  if (typeof s.prevT === "boolean") state.prevT = s.prevT;
  if (typeof s.prevC === "boolean") state.prevC = s.prevC;
  if (typeof s.gnomes === "boolean") state.gnomes = s.gnomes;
  if (typeof s.crewStyle === "string") {
    if (window.CREWS && window.CREWS[s.crewStyle]) state.crewStyle = s.crewStyle;
  }
  if (Array.isArray(s.collapsed)) state.collapsed = s.collapsed.filter((x) => typeof x === "string");
  if (typeof s.includeSub === "boolean") state.includeSub = s.includeSub;
  if (typeof s.sortKey === "string") state.sortKey = s.sortKey;
  if (s.sortDir === 1 || s.sortDir === -1) state.sortDir = s.sortDir;
  if (typeof s.headingText === "string") state.headingText = s.headingText.slice(0, 60);
  if (typeof s.hideHeading === "boolean") state.hideHeading = s.hideHeading;
  if (typeof s.tabTitleText === "string") state.tabTitleText = s.tabTitleText.slice(0, 60);
  state._from = s.from || "";
  state._to = s.to || "";
  return true;
}

const THEME_KEY = "usage-theme";
const THEMES = ["auto", "dark", "light"];
function themePref() {
  try {
    const t = localStorage.getItem(THEME_KEY);
    return THEMES.includes(t) ? t : "auto";
  } catch { return "auto"; }
}
function isDark() {
  const t = themePref();
  return t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
}
function applyTheme() {
  const t = themePref();
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  const select = document.getElementById("theme");
  if (select) select.value = t;
  if (window.Chart) {
    const dark = isDark();
    Chart.defaults.color = dark ? "#9a9aa3" : "#666";
    Chart.defaults.borderColor = dark ? "#333" : "#ddd";
    const tt = Chart.defaults.plugins.tooltip || (Chart.defaults.plugins.tooltip = {});
    tt.backgroundColor = dark ? "#2a2a2e" : "#ffffff";
    tt.titleColor = dark ? "#c6c6ce" : "#1a1a1a";
    tt.bodyColor = dark ? "#c6c6ce" : "#1a1a1a";
    tt.borderColor = dark ? "#444" : "#ddd";
    tt.borderWidth = 1;
    for (const c of Object.values(charts)) c.update("none");
  }
}
function refreshGnomeBtn() {
  const gbtn = document.getElementById("gnomes");
  if (gbtn) gbtn.checked = state.gnomes;
}
function refreshCrewBtn() {
  const cbtn = document.getElementById("crewstyle");
  if (!cbtn || !window.CREWS) return;
  const ids = Object.keys(window.CREWS);
  if (!ids.includes(state.crewStyle)) state.crewStyle = ids.includes("gnomes") ? "gnomes" : ids[0];
  const existing = [...cbtn.options].map((o) => o.value);
  if (existing.join("\0") !== ids.join("\0")) {
    cbtn.replaceChildren(...ids.map((id) => {
      const option = document.createElement("option");
      option.value = id;
      option.textContent = window.CREWS[id].displayName;
      return option;
    }));
  }
  cbtn.value = state.crewStyle;
}
window.addEventListener("crewregistered", refreshCrewBtn);
function crewFig(tool) {
  // Thin dispatcher: figures live in crews/<id>.js as def.fig.
  return crewDef(state.crewStyle).fig(tool);
}
function gridColor() {
  return isDark() ? "#333" : "#ddd";
}

let ALL = [];
function setMeta() {
  const est = ALL.filter((r) => r.estimated).length;
  const gen = window.USAGE ? new Date(window.USAGE.generatedAt).toLocaleString(localeTag()) : "—";
  document.getElementById("meta-text").textContent =
    `${ALL.length} ${t("meta_records")}` +
    (est ? t("meta_est", { n: est }) : "") +
    ` · ${t("meta_gen")} ` + gen;
}
function refreshProjects() {
  const sel = document.getElementById("project");
  const projects = [...new Set(ALL.map((r) => r.project))].sort();
  const have = [...sel.options].map((o) => o.value);
  if (have.length === projects.length + 1 && projects.every((p) => have.includes(p))) return;
  sel.innerHTML = '';
  const all = document.createElement("option");
  all.value = ""; all.textContent = t("all");
  sel.appendChild(all);
  for (const p of projects) {
    const o = document.createElement("option");
    o.value = p; o.textContent = p;
    sel.appendChild(o);
  }
  sel.value = state.project;
}
// Push every control widget to match state (boot + server-prefs arrival).
function syncControls() {
  refreshProjects();
  const ls = document.getElementById("lang");
  if (ls) ls.value = state.lang;
  document.getElementById("project").value = state.project || "";
  if (state._from) document.getElementById("from").value = state._from;
  if (state._to) document.getElementById("to").value = state._to;
  document.querySelectorAll("#presets button").forEach((b) =>
    b.classList.toggle("active", b.dataset.range === state.preset));
  document.querySelectorAll("#tools input[data-tool]").forEach((input) =>
    (input.checked = state.tools.has(input.dataset.tool)));
  document.querySelectorAll("#tiles-menu input[data-kpi]").forEach((input) =>
    (input.checked = state.kpis.has(input.dataset.kpi)));
  document.getElementById("sub").checked = state.includeSub;
  const gsel = document.getElementById("group");
  if (gsel) gsel.value = state.group;
  const msel = document.getElementById("metric");
  if (msel) msel.value = state.metric;
  const hh = document.getElementById("hideheading");
  if (hh) hh.checked = state.hideHeading;
  const ht = document.getElementById("headingtext");
  if (ht) ht.value = state.headingText;
  const ttt = document.getElementById("tabtitletext");
  if (ttt) ttt.value = state.tabTitleText;
  applyTitles();
}

// Two independent overrides: the on-page H1 and the browser tab title.
// Hiding the heading blanks it outright (a bare topbar, crew + settings
// button only). The tab title has no hide option — browser tabs read a
// blank title as broken, not intentional — so it only ever renames.
function applyTitles() {
  const heading = document.getElementById("pageheading");
  if (heading) heading.textContent = state.hideHeading ? "" : (state.headingText || DEFAULT_TITLE);
  document.title = state.tabTitleText || DEFAULT_TITLE;
}

function buildTileControls() {
  const wrap = document.getElementById("tiles-menu");
  if (!wrap) return;
  const boxes = KPI_IDS.map((id) => {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.dataset.kpi = id;
    const text = document.createElement("span");
    text.dataset.k = "k_" + id;
    text.textContent = t("k_" + id);
    label.append(input, text);
    return label;
  });
  const actions = document.createElement("div");
  actions.className = "picker-actions";
  const allBtn = document.createElement("button");
  allBtn.type = "button";
  allBtn.dataset.k = "all";
  allBtn.textContent = t("all");
  allBtn.addEventListener("click", () => {
    state.kpis = new Set(KPI_IDS);
    saveState(); syncControls(); render();
  });
  const noneBtn = document.createElement("button");
  noneBtn.type = "button";
  noneBtn.dataset.k = "none";
  noneBtn.textContent = t("none");
  noneBtn.addEventListener("click", () => {
    state.kpis = new Set();
    saveState(); syncControls(); render();
  });
  actions.append(allBtn, noneBtn);
  wrap.replaceChildren(...boxes, actions);
}

function buildToolControls() {
  const wrap = document.getElementById("tools");
  if (!wrap) return;
  wrap.replaceChildren(...TOOLS.map((id) => {
    const label = document.createElement("label");
    label.className = "harness-option";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.dataset.tool = id;

    return label;
  }));
}

function range() {
  const now = Date.now();
  const day = 86400000;
  switch (state.preset) {
    case "1h": return [now - 3600000, now];
    case "3h": return [now - 3 * 3600000, now];
    case "6h": return [now - 6 * 3600000, now];
    case "today": { const d = new Date(); d.setHours(0, 0, 0, 0); return [d.getTime(), now]; }
    case "7d": return [now - 7 * day, now];
    case "30d": return [now - 30 * day, now];
    case "90d": return [now - 90 * day, now];
    case "all": {
      if (!ALL.length) return [now, now];
      return [Math.min(...ALL.map((r) => r.ts)), now];
    }
    case "custom": {
      const f = document.getElementById("from").value, t = document.getElementById("to").value;
      const from = f ? new Date(f + "T00:00:00").getTime() : Math.min(...ALL.map((r) => r.ts));
      const to = t ? new Date(t + "T23:59:59.999").getTime() : now;
      return [from, to];
    }
  }
}

function filtered(from, to) {
  return ALL.filter(
    (r) =>
      r.ts >= from && r.ts <= to &&
      state.tools.has(r.tool) &&
      (!state.project || r.project === state.project) &&
      (state.includeSub || !r.sidechain)
  );
}

function kpis(recs) {
  const s = new Set();
  const k = { total: 0, active: 0, input: 0, cacheRead: 0, cacheWrite: 0, output: 0, cost: 0, costN: 0, est: 0, priced: 0, unpriced: 0 };
  for (const r of recs) {
    s.add(r.tool + ":" + r.session);
    const t = totalOf(r);
    k.total += t;
    k.active += r.active ?? (r.input + r.output);
    k.input += r.input; k.cacheRead += r.cacheRead; k.cacheWrite += r.cacheWrite; k.output += r.output;
    if (r.estimated) k.est++;
    if (r.cost != null) { k.cost += r.cost; k.costN++; k.priced += t; }
    else k.unpriced += t;
  }
  k.sessions = s.size;
  k.avg = k.sessions ? k.total / k.sessions : 0;
  k.avgActive = k.sessions ? k.active / k.sessions : 0;
  const denom = k.input + k.cacheRead + k.cacheWrite;
  k.hit = denom ? k.cacheRead / denom : 0;
  k.coverage = k.total ? k.priced / k.total : 0;
  return k;
}

// Today's burn pace vs trailing-30d daily average (active tokens).
// Respects tool/project/subagent filters; comparand is always calendar-based.
function burnStats() {
  const now = Date.now();
  const day = 86400000;
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  const sumActive = (recs) => recs.reduce((a, r) => a + (r.active ?? (r.input + r.output)), 0);
  const today = sumActive(filtered(d.getTime(), now));
  const elapsed = Math.max((now - d.getTime()) / day, 1 / 48); // floor at 30min
  const projected = today / elapsed;
  const base = sumActive(filtered(now - 30 * day, d.getTime())) / 30;
  return { projected, base };
}

// Polarity: 'neg' (up is bad: tokens, cost), 'pos' (up is good: hit rate),
// 'flat' (direction carries no signal: sessions, averages — always muted).
// Absurd jumps cap as a ×N multiplier instead of ▲5661%.
function delta(cur, prev, pol = "neg") {
  if (prev === 0) return cur === 0 ? ["—", "flat"] : [t("new_label"), pol === "pos" ? "down" : pol === "flat" ? "flat" : "up"];
  const pct = ((cur - prev) / Math.abs(prev)) * 100;
  if (Math.abs(pct) < 0.5) return ["0%", "flat"]; // rounds to zero: no direction
  const arrow = pct > 0 ? "▲ " : "▼ ";
  if (pol === "flat") {
    if (pct > 999) return [arrow + "×" + mult(cur / prev), "flat"];
    return [arrow + Math.abs(pct).toFixed(0) + "%", "flat"];
  }
  if (pct > 999) return [arrow + "×" + mult(cur / prev), pct > 0 === (pol === "neg") ? "up" : "down"];
  const good = pol === "pos" ? pct > 0 : pct < 0;
  return [arrow + Math.abs(pct).toFixed(0) + "%", good ? "down" : "up"];
}
function mult(ratio) {
  return ratio >= 100 ? String(Math.round(ratio)) : ratio.toFixed(1).replace(/\.0$/, "");
}
function hexA(hex, alpha) {
  const m = String(hex).match(/^#([0-9a-f]{6})$/i);
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}

const charts = {};
function makeChart(id, cfg) {
  if (charts[id]) { charts[id].data = cfg.data; charts[id].options = cfg.options; charts[id].update("none"); }
  else charts[id] = new Chart(document.getElementById(id), cfg);
}
function bucketize(recs, from, to) {
  const span = to - from;
  const mode = span <= 6 * 3600000 ? "min" : span <= 2 * 86400000 ? "hour" : span <= 120 * 86400000 ? "day" : "week";
  const minStep = (span <= 3600000 ? 5 : 15) * 60000; // 5-min buckets for 1h, 15-min up to 6h
  const step = mode === "min" ? minStep : mode === "hour" ? 3600000 : mode === "day" ? 86400000 : 7 * 86400000;
  const keyOf = (ts) => {
    const d = new Date(ts);
    if (mode === "min") return Math.floor(ts / minStep) * minStep;
    if (mode === "hour") return new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours()).getTime();
    if (mode === "day") return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
    return monday.getTime();
  };
  const blank = () => ({
    ...Object.fromEntries(TOOLS.map((tool) => [tool, 0])),
    cost: Object.fromEntries(TOOLS.map((tool) => [tool, 0])),
  });
  const buckets = new Map();
  // Zero-fill the full span so dead hours/days render as gaps, not shifted bars.
  if (Number.isFinite(from) && Number.isFinite(to) && to > from) {
    for (let t = keyOf(from); t <= to; t += step) {
      if (!buckets.has(t)) buckets.set(t, { ts: t, ...blank() });
    }
  }
  for (const r of recs) {
    const k = keyOf(r.ts);
    if (!buckets.has(k)) buckets.set(k, { ts: k, ...blank() });
    const b = buckets.get(k);
    b[r.tool] += totalOf(r);
    if (r.cost != null) b.cost[r.tool] += r.cost;
  }
  return [...buckets.values()].sort((a, b) => a.ts - b.ts);
}
function bucketLabel(ts, from, to) {
  const loc = localeTag();
  const span = to - from;
  const d = new Date(ts);
  if (span <= 6 * 3600000) return d.toLocaleTimeString(loc, { hour: "numeric", minute: "2-digit" });
  if (span <= 2 * 86400000) {
    // Single-day window: hour alone ("1 AM"), no repeated "9/25" on every tick.
    if (new Date(from).toDateString() === new Date(to).toDateString()) {
      return d.toLocaleTimeString(loc, { hour: "numeric" });
    }
    return d.toLocaleString(loc, { month: "numeric", day: "numeric", hour: "numeric" });
  }
  return d.toLocaleDateString(loc, { month: "numeric", day: "numeric" });
}

function render() {
  const [from, to] = range();
  document.body.classList.toggle("custom-range", state.preset === "custom");
  document.body.classList.toggle("nognomes", !state.gnomes);
  const recs = filtered(from, to);
  // Intraday presets compare against the same clock window yesterday;
  // comparing against the dead overnight hours is pure noise.
  const [pfrom, pto] = prevRange(from, to);
  const prev = filtered(pfrom, pto);
  const day = 86400000;
  renderKpis(recs, prev, from, to);
  renderTimeCharts(recs, from, to, bucketize(prev, pfrom, pto));
  renderMix(recs);
  renderModels(recs);
  renderCostModels(recs);
  renderMtd();
  renderHitTrend(recs, from, to);
  renderCostSessions(recs);
  renderCrew(recs, from, to);
  renderHeat(filtered(Date.now() - 28 * day, Date.now())); // heatmap always trailing 28d
  renderTable(recs);
  renderPriceBook(recs);
}

// Every distinct model seen in the current window, with its resolved
// per-1M rate and provenance side by side — an audit view, not a chart,
// so a plain sorted table beats forcing this into the chart idiom.
function renderPriceBook(recs) {

  </tr></thead><tbody>${rows.map(({ model, info }) => {

    const p = info.price;

    return `<tr><td>${esc(model)}</td><td>${money(p.input)}</td><td>${money(p.output)}</td><td>${money(p.cacheRead)}</td><td>${money(p.cacheWrite)}</td><td>${src}</td></tr>`;
  }).join("")}</tbody></table>`;
}

function prevRange(from, to) {
  const day = 86400000;
  return (state.preset === "1h" || state.preset === "3h" || state.preset === "6h" || state.preset === "today")
    ? [from - day, to - day]
    : [from - (to - from), from - 1];
}

function costPerMillionActive(a) {
  return a.active > 0 && a.cost ? "$" + (a.cost / a.active * 1e6).toFixed(2) + "/1M active" : "";
}

// Zero isn't a direction: no cache writes today is absence, not improvement.
function zeroNeutral(cur, prev) {
  return cur === 0 ? ["—", "flat"] : delta(cur, prev, "neg");
}

function renderKpis(recs, prev, from = 0, to = 1) {
  const a = kpis(recs), b = kpis(prev);
  const burn = burnStats();
  // 7-slice sparklines: one pass buckets records, each tile reduces its own metric.
  const NSL = 7;
  const slices = Array.from({ length: NSL }, () => []);
  const wspan = Math.max(to - from, 1);
  for (const r of recs) {
    slices[Math.min(NSL - 1, Math.floor((r.ts - from) / wspan * NSL))].push(r);
  }
  const ssum = (f) => slices.map((s) => s.reduce((x, r) => x + f(r), 0));
  const sact = (r) => r.active ?? (r.input + r.output);
  const spTotal = ssum(totalOf), spActive = ssum(sact);
  const spIn = ssum((r) => r.input), spRead = ssum((r) => r.cacheRead);
  const spWrite = ssum((r) => r.cacheWrite), spOut = ssum((r) => r.output);
  const spCost = ssum((r) => r.cost || 0);
  const spHit = slices.map((s) => {
    const d = s.reduce((x, r) => x + r.input + r.cacheRead + r.cacheWrite, 0);
    return d ? s.reduce((x, r) => x + r.cacheRead, 0) / d * 100 : 0;
  });
  const spCov = slices.map((s) => {
    const t = s.reduce((x, r) => x + totalOf(r), 0);
    return t ? s.reduce((x, r) => x + (r.cost != null ? totalOf(r) : 0), 0) / t * 100 : 0;
  });
  const spSess = slices.map((s) => new Set(s.map((r) => r.tool + ":" + r.session)).size);
  const spAvg = slices.map((s, i) => (spSess[i] ? s.reduce((x, r) => x + sact(r), 0) / spSess[i] : 0));
  const spark = (vals, cls) => {
    const mx = Math.max(...vals), mn = Math.min(...vals);
    const pts = vals.map((v, i) => `${(i * 56 / (NSL - 1)).toFixed(1)},${(17 - (mx > mn ? (v - mn) / (mx - mn) * 15 : 7.5)).toFixed(1)}`).join(" ");
    const col = cls === "up" ? "var(--up)" : cls === "down" ? "var(--down)" : "var(--muted)";
    return `<svg class="spark" viewBox="0 0 56 18" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5"/></svg>`;
  };
  // Tile mascots: wheel speed follows burn pace, stamp audits coverage,
  // barbell scales with avg session size, receptionist greets new sessions.
  const ratio = burn.base > 0 ? burn.projected / burn.base : 0;
  const wspd = Math.min(1.2, Math.max(0.25, 1.2 - Math.log10(1 + ratio) * 0.4)).toFixed(2) + "s";
  const wheelTip = state.lang === "zh-Hant"
    ? `燃燒中：30 天平均的 ×${burn.base > 0 ? mult(ratio) : "—"}${ratio > 2 ? " — 喘不過氣了！" : ""}`
    : `Burning ×${burn.base > 0 ? mult(ratio) : "—"} of 30d pace${ratio > 2 ? " — panting!" : ""}`;
  const wheel = `<span class="wheel${ratio > 2 ? " pant" : ""}" style="--wspd:${wspd}" title="${wheelTip}"><span class="rim"></span><span class="ham">${crewHead("#6E56CF")}</span><span class="sweat"></span></span>`;
  const audit = a.coverage < 1;
  const acctTip = audit
    ? t("tip_await", { n: fmt(a.unpriced) })
    : t("tip_priced");
  const acct = `<span class="acct${audit ? " audit" : ""}" title="${acctTip}"><span class="stmp">${audit ? "?" : "✓"}</span>${crewHead("#10A37F")}</span>`;
  const barW = Math.round(Math.min(28, Math.max(14, 14 + Math.log10(1 + a.avgActive) * 8)));
  const heavy = a.avgActive > 0 && barW >= 26;
  const liftTip = a.avgActive <= 0
    ? t("tip_bar")
    : (state.lang === "zh-Hant"
      ? `每工作階段平均 ${fmt(a.avgActive)} 個活躍 token${heavy ? " — 重訓日！" : ""}`
      : `${fmt(a.avgActive)} active tokens/session on average${heavy ? " — leg day!" : ""}`);
  const lift = `<span class="lift${heavy ? " straining" : ""}" title="${liftTip}">${crewHead("#D97757")}<span class="bar" style="width:${barW}px"><i></i><i></i></span></span>`;
  const grew = lastSessN > 0 && a.sessions > lastSessN;
  const recepTip = grew
    ? t("tip_sess_new", { n: a.sessions - lastSessN })
    : t("tip_sess_window", { n: a.sessions });
  const recep = `<span class="recep" title="${recepTip}">${crewHead("#6E56CF")}<span class="wave"></span>${grew ? `<span class="guest">${crewHead("#10A37F")}</span>` : ""}</span>`;
  lastSessN = a.sessions;
  // Merchant faints when the priciest model costs 100x+ the cheapest per active token.
  const byModel = new Map();
  for (const r of recs) {
    if (r.cost == null) continue;
    const m = byModel.get(r.model) || { cost: 0, active: 0 };
    m.cost += r.cost;
    m.active += r.active ?? (r.input + r.output);
    byModel.set(r.model, m);
  }
  let cheap = null, dear = null;
  for (const [m, v] of byModel) {
    if (v.active <= 0 || v.cost <= 0) continue;
    const u = v.cost / v.active;
    if (!cheap || u < cheap.u) cheap = { m, u };
    if (!dear || u > dear.u) dear = { m, u };
  }
  const gap = cheap && dear && cheap.u > 0 ? dear.u / cheap.u : 0;
  const merchTitle = cheap && dear
    ? `${String(dear.m).slice(0, 24)} ${money(dear.u * 1e6)}/1M vs ${String(cheap.m).slice(0, 24)} ${money(cheap.u * 1e6)}/1M (×${mult(gap)})\n\n${priceTip(dear.m)}\n\n${priceTip(cheap.m)}`
    : t("tip_merch_none");
  const merch = `<span class="merch${gap > 100 ? " faint" : ""}" title="${esc(merchTitle)}">${crewHead("#e0a100")}<span class="tag">$</span></span>`;
  const full = a.cacheWrite > 0;
  const bucketTip = full
    ? t("tip_bucket_full", { n: fmt(a.cacheWrite) })
    : t("tip_bucket_empty");
  const bucket = `<span class="bucket${full ? " full" : ""}" title="${bucketTip}">${bucketSVG(full)}</span>`;
  const tiles = [
    ["total", t("k_total"), fmt(a.total), delta(a.total, b.total, "neg"), "", "", wrestle(a.total, b.total), spark(spTotal, delta(a.total, b.total, "neg")[1])],
    ["active", t("k_active"), fmt(a.active), delta(a.active, b.active, "neg"), "", "", wrestle(a.active, b.active), spark(spActive, delta(a.active, b.active, "neg")[1])],
    ["burn", t("k_burn"), fmt(burn.projected) + " " + t("proj"), delta(burn.projected, burn.base, "neg"), t("sub_burn"), wheel, wrestle(burn.projected, burn.base), spark(spActive, delta(burn.projected, burn.base, "neg")[1])],
    ["input", t("k_input"), fmt(a.input), delta(a.input, b.input, "neg"), "", "", wrestle(a.input, b.input), spark(spIn, delta(a.input, b.input, "neg")[1])],
    ["cread", t("k_cread"), fmt(a.cacheRead), delta(a.cacheRead, b.cacheRead, "neg"), "", "", wrestle(a.cacheRead, b.cacheRead), spark(spRead, delta(a.cacheRead, b.cacheRead, "neg")[1])],
    ["cwrite", t("k_cwrite"), fmt(a.cacheWrite), zeroNeutral(a.cacheWrite, b.cacheWrite), "", bucket, "", spark(spWrite, zeroNeutral(a.cacheWrite, b.cacheWrite)[1])],
    ["output", t("k_output"), fmt(a.output), delta(a.output, b.output, "neg"), "", "", wrestle(a.output, b.output), spark(spOut, delta(a.output, b.output, "neg")[1])],
    ["hit", t("k_hit"), (a.hit * 100).toFixed(1) + "%", delta(a.hit, b.hit, "pos"), "", "", "", spark(spHit, delta(a.hit, b.hit, "pos")[1])],
    ["cost", t("k_cost"), money(a.cost), delta(a.cost, b.cost, "neg"), costPerMillionActive(a), merch, wrestle(a.cost, b.cost), spark(spCost, delta(a.cost, b.cost, "neg")[1])],
    ["cov", t("k_cov"), (a.coverage * 100).toFixed(1) + "%", delta(a.coverage, b.coverage, "pos"), a.unpriced ? fmt(a.unpriced) + " " + t("unpriced") : "", acct, "", spark(spCov, delta(a.coverage, b.coverage, "pos")[1])],
    ["sess", t("k_sess"), String(a.sessions), delta(a.sessions, b.sessions, "flat"), "", recep, wrestle(a.sessions, b.sessions), spark(spSess, "flat")],
    ["avg", t("k_avg"), fmt(a.avgActive), delta(a.avgActive, b.avgActive, "flat"), "", lift, wrestle(a.avgActive, b.avgActive), spark(spAvg, "flat")],
  ];
  document.getElementById("kpis").innerHTML = tiles
    .filter(([id]) => state.kpis.has(id))
    .map(([, n, v, [d, c], sub, masc, w, sp]) => `<div class="kpi"><div class="name"><span class="nametext" title="${n}">${n}</span>${masc ? `<span class="mascot">${masc}</span>` : ""}</div><div class="val">${v}</div>${sp || ""}<div class="delta ${c}">${d}${w || ""}</div>${sub ? `<div class="delta flat" title="Unit cost on real work (cache excluded)">${sub}</div>` : ""}</div>`)
    .join("");
}

function renderTimeCharts(recs, from, to, prevBuckets = []) {
  const buckets = bucketize(recs, from, to);
  const labels = buckets.map((b) => bucketLabel(b.ts, from, to));
  const live = TOOLS.filter((t) => buckets.some((b) => b[t] > 0 || b.cost[t] > 0));
  const shown = live.length ? live : TOOLS;
  // Dashed previous-period overlay, bucket-aligned (equal spans => equal counts).
  const prevT = prevBuckets.map((b) => TOOLS.reduce((sum, tool) => sum + (b[tool] || 0), 0));
  const prevC = prevBuckets.map((b) => Math.round(TOOLS.reduce((sum, tool) => sum + (b.cost[tool] || 0), 0) * 100) / 100);
  const hasPrev = prevT.some((v) => v > 0) || prevC.some((v) => v > 0);
  const showPT = state.prevT !== false && hasPrev; // undefined (old saves) = on
  const showPC = state.prevC !== false && hasPrev;
  const prevLine = (data, color, gaps) => ({
    type: "line", label: t("prev_period"), data, pointStyle: "line",
    borderColor: color, borderDash: [5, 4], pointRadius: 0, tension: 0.3,
    ...(gaps ? { spanGaps: true } : {}),
  });
  const legendLine = { labels: { usePointStyle: true } }; // boxes -> rects, prev -> short dotted line
  // Log mode: orders of magnitude stay readable together (yesterday's $6
  // spike no longer flattens today's $0.05 line). Stacking off on log —
  // stacked sums misbehave on logarithmic axes. Zeros become nulls so lines
  // bridge dead buckets instead of punching dotted gaps; ticks label powers only.
  const logTick = (prefix, f) => (v) => {
    if (!(v > 0)) return "";
    const l = Math.log10(v);
    return Math.abs(l - Math.round(l)) < 1e-9 ? prefix + f(v) : "";
  };
  document.getElementById("logt").classList.toggle("active", !!state.logT);
  document.getElementById("logc").classList.toggle("active", !!state.logC);
  document.getElementById("prevt").classList.toggle("active", state.prevT !== false);
  document.getElementById("prevc").classList.toggle("active", state.prevC !== false);
  // The trailing bucket is still accumulating when the range ends at now.
  const partial = buckets.length > 1 && to >= Date.now() - 60000;
  const last = buckets.length - 1;
  const barColor = (t) => buckets.map((_, i) => (partial && i === last ? hexA(COLORS[t], 0.45) : COLORS[t]));
  const progressFooter = (asMoney) => (items) => {
    if (!items.length) return "";
    const i = items[0].dataIndex;
    const tot = TOOLS.reduce((sum, tool) => sum + (buckets[i][tool] || 0), 0);
    const ctot = TOOLS.reduce((sum, tool) => sum + (buckets[i].cost[tool] || 0), 0);
    const lines = [asMoney ? `total ${money(ctot)} · ${fmt(tot)} tokens` : `total ${fmt(tot)} · ${money(ctot)}`];
    if (partial && i === last) lines.push(t("cur_progress"));
    return lines;
  };
  makeChart("c-tokens", {
    type: "bar",
    data: {
      labels,
      datasets: [
        ...shown.map((t) => ({ label: t, data: buckets.map((b) => b[t]), backgroundColor: barColor(t), pointStyle: "rect" })),
        ...(showPT ? [prevLine(state.logT ? prevT.map((v) => (v === 0 ? null : v)) : prevT, "#9a9aa3", state.logT)] : []),
      ],
    },
    options: { responsive: true, plugins: { tooltip: { callbacks: { footer: progressFooter(false) } }, legend: legendLine }, scales: { x: { stacked: !state.logT, ticks: { maxTicksLimit: 12 } }, y: { stacked: !state.logT, type: state.logT ? "logarithmic" : "linear", ticks: { callback: state.logT ? logTick("", fmt) : fmt } } } },
  });
  makeChart("c-cost", {
    type: "line",
    data: {
      labels,
      datasets: [
        ...shown.map((t) => ({
          label: t, data: buckets.map((b) => {
            const v = Math.round(b.cost[t] * 100) / 100;
            return state.logC && v === 0 ? null : v;
          }), pointStyle: "rect",
          borderColor: COLORS[t], backgroundColor: COLORS[t], tension: 0.3, cubicInterpolationMode: "monotone",
          ...(state.logC ? { spanGaps: true } : {}),
        })),
        ...(showPC ? [prevLine(state.logC ? prevC.map((v) => (v === 0 ? null : v)) : prevC, "#9a9aa3", state.logC)] : []),
      ],
    },
    options: { responsive: true, plugins: { tooltip: { callbacks: { footer: progressFooter(true) } }, legend: legendLine }, scales: { x: { ticks: { maxTicksLimit: 12 } }, y: { type: state.logC ? "logarithmic" : "linear", ticks: { callback: state.logC ? logTick("$", (v) => v) : (v) => "$" + v } } } },
  });
}

function renderMix(recs) {
  const agg = {};
  TOOLS.forEach((t) => (agg[t] = { input: 0, cacheRead: 0, cacheWrite: 0, output: 0 }));
  for (const r of recs) {
    if (!agg[r.tool]) continue;
    agg[r.tool].input += r.input;
    agg[r.tool].cacheRead += r.cacheRead;
    agg[r.tool].cacheWrite += r.cacheWrite;
    agg[r.tool].output += r.output + (r.reasoningSeparate ? r.reasoning : 0);
  }
  const rows = TOOLS.filter((t) => agg[t].input + agg[t].cacheRead + agg[t].cacheWrite + agg[t].output > 0);
  const shown = rows.length ? rows : TOOLS;
  const parts = [
    ["input", t("mix_input"), "#8888cc"], ["cacheRead", t("mix_cread"), "#4caf7d"], ["cacheWrite", t("mix_cwrite"), "#e0a100"], ["output", t("mix_output"), "#d97757"],
  ];
  const totals = Object.fromEntries(shown.map((t) => [t, agg[t].input + agg[t].cacheRead + agg[t].cacheWrite + agg[t].output]));
  const valOf = (t, k) => (state.mixPct && totals[t] ? agg[t][k] / totals[t] * 100 : agg[t][k]);
  document.getElementById("mixpct").classList.toggle("active", state.mixPct);
  makeChart("c-mix", {
    type: "bar",
    data: {
      labels: shown,
      datasets: parts.map(([k, lbl, c]) => ({ label: lbl, data: shown.map((t) => Math.round(valOf(t, k) * 10) / 10), backgroundColor: c })),
    },
    options: {
      indexAxis: "y", responsive: true,
      plugins: {
        tooltip: {
          callbacks: state.mixPct
            ? { label: (ctx) => {
              const part = parts.find((p) => p[1] === ctx.dataset.label);
              const key = part ? part[0] : ctx.dataset.label;
              return ` ${ctx.dataset.label}: ${ctx.parsed.x.toFixed(1)}% (${fmt(agg[ctx.label][key])})`;
            } }
            : {},
        },
      },
      scales: {
        x: { stacked: true, min: state.mixPct ? 0 : undefined, max: state.mixPct ? 100 : undefined, ticks: { callback: state.mixPct ? (v) => v + "%" : fmt } },
        y: { stacked: true },
      },
    },
  });
}

function groupKey(r) {
  switch (state.group) {

    case "tool+model": return `${r.tool}:${r.model}`;
    case "workspace+model": return `${r.workspace}:${r.model}`;

}

function renderModels(recs) {
  const agg = {};
  for (const r of recs) {
    const k = groupKey(r);
    agg[k] = (agg[k] || 0) + totalOf(r);

  const titles = { model: t("g_top_model"), project: t("g_top_project"), workspace: t("g_top_workspace"), "tool+model": t("g_top_toolmodel"), "workspace+model": t("g_top_wmodel") };
  document.getElementById("group-title").textContent = titles[state.group] || t("g_top_model");
  const top = Object.entries(agg).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const sum = top.reduce((x, [, v]) => x + v, 0);

    cm.setAttribute("aria-label", `Crowned: ${top[0][0]} at ${fmt(top[0][1])} (${(top[0][1] / (sum || 1) * 100).toFixed(0)}% of window)`);

  // Model dimension lives at the end of a "tool+model"/"workspace+model" key
  // (split on the group's own separator); plain "model" grouping is the key
  // itself. Any other grouping has no single model to price.
  const modelOf = (label) => {
    if (state.group === "model") return label;
    if (state.group === "tool+model" || state.group === "workspace+model") {

      return i >= 0 ? label.slice(i + 1) : null;
    }

  makeChart("c-models", {

      labels: top.map(([m]) => m),
      datasets: [{ data: top.map(([, v]) => v), backgroundColor: "#6E56CF" }],

        legend: { display: false },

}

function dayKey(ts) {
  const d = new Date(ts);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
}

function renderMtd() {
  const now = Date.now();
  const start = new Date();
  start.setDate(1);
  start.setHours(0, 0, 0, 0);
  const dim = new Date(start.getFullYear(), start.getMonth() + 1, 0).getDate();
  const glass = document.getElementById("mtdglass");
  if (glass) {
    const frac = Math.min(1, (now - start.getTime()) / (dim * 86400000));
    const day = Math.min(dim, Math.floor((now - start.getTime()) / 86400000) + 1);
    glass.innerHTML = glassSVG(frac);
    glass.title = `Day ${day} of ${dim} — sand is the month elapsed`;
  }
  const recs = filtered(start.getTime(), now);
  const perDay = new Map();
  for (const r of recs) {
    if (r.cost == null) continue;
    const k = dayKey(r.ts);
    perDay.set(k, (perDay.get(k) || 0) + r.cost);
  }
  const labels = [];
  const data = [];
  let cum = 0;
  for (let t = start.getTime(); t <= now; t += 86400000) {
    const k = dayKey(t);
    cum += perDay.get(k) || 0;
    labels.push(new Date(t).toLocaleDateString([], { month: "numeric", day: "numeric" }));
    data.push(Math.round(cum * 100) / 100);
  }
  makeChart("c-mtd", {
    type: "line",
    data: { labels, datasets: [{ label: "cumulative cost", data, borderColor: "#e0a100", backgroundColor: "#e0a100", tension: 0.2, fill: true }] },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { ticks: { maxTicksLimit: 12 } }, y: { ticks: { callback: (v) => "$" + v } } } },
  });
}

function renderHitTrend(recs, from, to) {
  // Intraday windows bucket hourly (a single daily dot says nothing);
  // longer windows stay daily.
  const hourly = to - from <= 2 * 86400000;
  const step = hourly ? 3600000 : 86400000;
  const keyOf = hourly ? (ts) => Math.floor(ts / 3600000) * 3600000 : dayKey;
  const per = new Map();
  const blank = () => ({ input: 0, cacheRead: 0, cacheWrite: 0 });
  if (Number.isFinite(from) && Number.isFinite(to) && to > from) {
    for (let t = keyOf(from); t <= to; t += step) per.set(t, blank());
  }
  for (const r of recs) {
    const k = keyOf(r.ts);
    if (!per.has(k)) per.set(k, blank());
    const b = per.get(k);
    b.input += r.input; b.cacheRead += r.cacheRead; b.cacheWrite += r.cacheWrite;
  }
  const keys = [...per.keys()].sort((x, y) => x - y);
  const labels = keys.map((t) => hourly
    ? new Date(t).toLocaleTimeString([], { hour: "numeric" })
    : new Date(t).toLocaleDateString([], { month: "numeric", day: "numeric" }));
  const data = keys.map((t) => {
    const b = per.get(t);
    const denom = b.input + b.cacheRead + b.cacheWrite;
    return denom ? Math.round(b.cacheRead / denom * 1000) / 10 : null;
  });
  makeChart("c-hit", {
    type: "line",
    data: { labels, datasets: [{ label: "hit rate %", data, borderColor: "#4caf7d", backgroundColor: "#4caf7d", tension: 0.2, spanGaps: true }] },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { ticks: { maxTicksLimit: 12 } }, y: { min: 0, max: 100, ticks: { callback: (v) => v + "%" } } } },
  });
}

function renderCostSessions(recs) {
  const groups = new Map();
  for (const r of recs) {
    if (r.cost == null) continue;
    const k = r.tool + ":" + r.session;
    if (!groups.has(k)) groups.set(k, { tool: r.tool, title: r.title || r.session.slice(0, 8), cost: 0, total: 0, models: new Set() });
    const g = groups.get(k);
    g.cost += r.cost;
    g.total += totalOf(r);
    g.models.add(r.model);
  }
  const top = [...groups.values()].sort((a, b) => b.cost - a.cost).slice(0, 10);
  const maxCost = Math.max(0, ...top.map((g) => g.cost));
  document.getElementById("topsess").innerHTML = top.length
    ? `<table><tbody>${top.map((g) => {
      const share = maxCost > 0 ? g.cost / maxCost : 0;
      const w = Math.round(11 + 15 * share);
      const lean = Math.round(share * 12);
      const title = String(g.title);
      const shortTitle = title.length > 34 ? title.slice(0, 34) + "…" : title;
      const porterTip = `Porter strains under ${money(g.cost)}\n\n${[...g.models].map(priceTip).join("\n\n")}`;
      return `<tr><td><span class="dot" style="background:${COLORS[g.tool]}"></span>${esc(g.tool)}</td><td title="${esc(title)}">${esc(shortTitle)}</td><td class="num">${fmt(g.total)}</td><td class="num"><span class="porter" style="width:${w}px;transform:rotate(${lean}deg)" title="${esc(porterTip)}">${crewHead(COLORS[g.tool])}</span> ${money(g.cost)}</td></tr>`;
    }).join("")}</tbody></table>`
    : `<div style="color:var(--muted);font-size:0.8rem">${shrugSVG()}No priced sessions in range.</div>`;
}

// Canvas gnomes: on the cost chart they climb the bars scaled by value
// share (leader plants a flag); on the models chart the leader alone wears
// a crown. Static drawing (no rAF), one paint per chart update.
const climberPlugin = {
  id: "climbers",
  afterDatasetsDraw(chart) {
    if (typeof state !== "undefined" && state.gnomes === false) return; // crew off = no canvas gnomes
    const meta = chart.getDatasetMeta(0);
    if (!meta || !meta.data.length) return;
    const vals = chart.data.datasets[0].data;
    const max = Math.max(0, ...vals);
    const ctx = chart.ctx;
    if (chart.canvas && chart.canvas.id === "c-models") {
      const bar = meta.data[0];
      const s = 7;
      ctx.save();
      ctx.translate(bar.x + s * 1.6, bar.y);
      ctx.fillStyle = "#e0a100";
      ctx.beginPath();
      ctx.moveTo(-s, 0); ctx.lineTo(-s, -s); ctx.lineTo(-s / 2, -s / 2);
      ctx.lineTo(0, -s - 1); ctx.lineTo(s / 2, -s / 2); ctx.lineTo(s, -s); ctx.lineTo(s, 0);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      return;
    }
    meta.data.forEach((bar, i) => {
      const s = max > 0 ? 6 + 8 * (vals[i] / max) : 6;
      ctx.save();
      ctx.translate(bar.x + s * 0.8, bar.y);
      const customClimber = crewDef(state.crewStyle).climber;
      if (typeof customClimber === "function") {
        customClimber(ctx, s, i === 0);
        ctx.restore();
        return;
      }
      ctx.fillStyle = "#e0a100";
      ctx.beginPath();
      ctx.moveTo(0, -s); ctx.lineTo(-s * 0.55, -s * 0.25); ctx.lineTo(s * 0.55, -s * 0.25);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#f2c9a0";
      ctx.beginPath(); ctx.arc(0, 0, s * 0.48, 0, 7); ctx.fill();
      ctx.fillStyle = "#dcdce0";
      ctx.beginPath();
      ctx.moveTo(-s * 0.28, s * 0.15); ctx.lineTo(s * 0.28, s * 0.15); ctx.lineTo(0, s * 0.62);
      ctx.closePath(); ctx.fill();
      if (i === 0) {
        ctx.strokeStyle = "#9a9aa3"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(s * 0.5, -s * 0.2); ctx.lineTo(s * 0.5, -s * 1.2); ctx.stroke();
        ctx.fillStyle = "#e0a100";
        ctx.beginPath();
        ctx.moveTo(s * 0.5, -s * 1.2); ctx.lineTo(s * 1.1, -s * 1.0); ctx.lineTo(s * 0.5, -s * 0.8);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    });
  },
};

function metricVal(r) {

// Garden gnome crew: one worker per tool. Bounce + tool-swing speed follows
// active tokens/sec in the current window (log scale). Zero = sleeping pose.

// Page pets: the shared controller owns scheduling and movement. Each crew
// owns its art and may provide a petProfile for personality, pacing and copy.

const PET_SHADOW = `<ellipse cx="32" cy="60.5" rx="15" ry="2.8" fill="rgba(0,0,0,0.25)"/>`;
// Humanoid rig: P = {skin,arm,back,open,shut,deco,cover,smile,napMouth,
// top,bottoms,legCol,shoe}. cover draws last (hats, fringe, beards).
function humanPet(P, pose, f) {
  const shut = pose === "nap";
  const headInner = (P.back || "")
    + `<circle cx="32" cy="21" r="12" fill="${P.skin}"/>`
    + (shut ? P.shut : P.open) + (P.deco || "")
    + (shut ? P.napMouth : P.smile) + (P.cover || "");
  const armCol = P.arm || P.skin;
  const armL = `<line x1="24" y1="34" x2="20" y2="44" stroke="${armCol}" stroke-width="3.4" stroke-linecap="round"/>`
    + `<circle cx="20" cy="45" r="2.4" fill="${P.skin}"/>`;
  let lower = "", armR = "", rock = "", extra = "";
  if (pose === "sit" || pose === "nap") {
    lower = `<rect x="22" y="48" width="10" height="5" rx="2.5" fill="${P.legCol}"/>`
      + `<rect x="32" y="48" width="10" height="5" rx="2.5" fill="${P.legCol}"/>`
      + `<ellipse cx="24" cy="51.5" rx="3.2" ry="2.1" fill="${P.shoe}"/><ellipse cx="40" cy="51.5" rx="3.2" ry="2.1" fill="${P.shoe}"/>`;
    armR = `<line x1="40" y1="34" x2="43" y2="44" stroke="${armCol}" stroke-width="3.4" stroke-linecap="round"/>`
      + `<circle cx="43" cy="45" r="2.4" fill="${P.skin}"/>`;
  } else if (pose === "wave") {
    const up = f % 2 === 0;
    armR = `<line x1="40" y1="34" x2="${up ? 52 : 54}" y2="${up ? 20 : 24}" stroke="${armCol}" stroke-width="3.4" stroke-linecap="round"/>`
      + `<circle cx="${up ? 52 : 54}" cy="${up ? 19 : 23}" r="2.6" fill="${P.skin}"/>`;
    lower = `<rect x="25" y="48" width="5.5" height="9" fill="${P.legCol}"/><rect x="33.5" y="48" width="5.5" height="9" fill="${P.legCol}"/>`
      + `<ellipse cx="27.5" cy="58" rx="3.6" ry="2.2" fill="${P.shoe}"/><ellipse cx="36.5" cy="58" rx="3.6" ry="2.2" fill="${P.shoe}"/>`;
  } else {

    const a = f % 2 === 0;
    const lift = pose === "run" ? 6 : 3.5, spread = pose === "run" ? 4 : 1.5;
    const legL = a ? 48 - lift : 48, legR = a ? 48 : 48 - lift;
    rock = pose === "run" ? (a ? ` rotate(8 32 48)` : ` rotate(-8 32 48)`) : (a ? ` rotate(3.5 32 48)` : ` rotate(-3.5 32 48)`);
    lower = `<rect x="${25 - (a ? spread : 0)}" y="${legL}" width="5.5" height="10" fill="${P.legCol}"/>`
      + `<rect x="${33.5 + (a ? spread : 0)}" y="${legR}" width="5.5" height="10" fill="${P.legCol}"/>`
      + `<ellipse cx="${27.5 - (a ? spread : 0)}" cy="${legL + 10}" rx="3.6" ry="2.2" fill="${P.shoe}"/>`
      + `<ellipse cx="${36.5 + (a ? spread : 0)}" cy="${legR + 10}" rx="3.6" ry="2.2" fill="${P.shoe}"/>`;
    armR = `<line x1="40" y1="34" x2="43" y2="${a ? 46 : 42}" stroke="${armCol}" stroke-width="3.4" stroke-linecap="round"/>`
      + `<circle cx="43" cy="${a ? 47 : 43}" r="2.4" fill="${P.skin}"/>`;
    if (pose === "run") extra = `<line x1="6" y1="36" x2="16" y2="36" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/>`
      + `<line x1="3" y1="43" x2="15" y2="43" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/>`;

    + `<g transform="rotate(${ang} 32 48)">`

// Dispatcher: pet matches the selected crew style (art in crews/<id>.js).

const DEFAULT_PET_PROFILE = {
  greetings: ["hi!", "hello!", "let's grow!", "nice work!"],
  weights: { walk: 40, run: 17, sit: 17, wave: 15, hop: 10, nap: 11, spin: 7 },
  speed: { walk: [40, 110], run: [200, 360] },
  timing: { sit: [1500, 6000], wave: [1500, 2400], nap: [5000, 11000], hopDuration: .5 },
  labels: { wave: "wave", walk: "walk", run: "run" },
  interaction: "wave",
};
function activePetProfile() {

  const p = def.petProfile || {};

    greetings: p.greetings || DEFAULT_PET_PROFILE.greetings,
    weights: Object.assign({}, DEFAULT_PET_PROFILE.weights, p.weights || {}),
    speed: Object.assign({}, DEFAULT_PET_PROFILE.speed, p.speed || {}),
    timing: Object.assign({}, DEFAULT_PET_PROFILE.timing, p.timing || {}),
    labels: Object.assign({}, DEFAULT_PET_PROFILE.labels, p.labels || {}),
